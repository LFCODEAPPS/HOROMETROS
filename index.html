<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Grupo Bautista | Control de Maquinaria</title>
<link rel="icon" type="image/png" href="bautista.png">
<link rel="apple-touch-icon" href="bautista.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grupo Bautista">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
(function(){var t=localStorage.getItem('gb_tema')||'auto';
if(t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');})();
</script>
<style>
:root{--bg:#F4F3F0;--card:#fff;--soft:#F0EEE9;--line:#E2DFD8;--tx:#1C1917;--mute:#5F5850;--brand:#B45309;--brandsoft:#FEF3C7;--ok:#15803D;--warn:#B45309;--bad:#B91C1C;--bar:#B45309;--shadow:0 1px 2px rgba(28,25,23,.06)}
html.dark{--bg:#060E1F;--card:#0D1C38;--soft:#091428;--line:#1E3A6B;--tx:#F1F5F9;--mute:#A3B2C8;--brand:#FBBF24;--brandsoft:rgba(251,191,36,.12);--ok:#4ADE80;--warn:#FBBF24;--bad:#F87171;--bar:#38BDF8;--shadow:none}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:48px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .3s}
button,select,input{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
.n{font-variant-numeric:tabular-nums}
.wrap{max-width:1152px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top::before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--tx),var(--brand),var(--tx))}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:44px;width:44px;object-fit:contain}
.brand h1{font-size:17px;font-weight:800;letter-spacing:.01em;line-height:1.1}
.brand p{font-size:12px;font-weight:600;color:var(--brand);margin-top:3px}
.tools{display:flex;align-items:center;gap:6px}
.ibtn{height:40px;min-width:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;border:1px solid var(--line);border-radius:12px;background:var(--soft);font-size:12px;font-weight:700;transition:transform .15s}
.ibtn:active{transform:scale(.94)}.ibtn:disabled{opacity:.35;cursor:not-allowed}
.ibtn svg{width:18px;height:18px}
select{height:40px;border:1px solid var(--line);border-radius:12px;background:var(--brandsoft);padding:0 10px;font-size:13px;font-weight:800;outline:none;min-width:118px;cursor:pointer}
select option{background:var(--card);color:var(--tx)}
.upd{font-size:11px;color:var(--mute);font-weight:600;padding:0 4px}
.bar2{display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 15px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700;color:var(--mute);transition:.15s}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.search{position:relative}
.search input{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:0 38px;font-size:14px;outline:none}
.search input:focus{border-color:var(--brand);background:var(--card)}
.search .ic{position:absolute;left:12px;top:12px;width:18px;height:18px;color:var(--mute)}
#x{position:absolute;right:6px;top:6px;width:30px;height:30px;color:var(--mute)}
@media(min-width:768px){.bar2{flex-direction:row;justify-content:space-between;align-items:center}.search{width:320px}.brand h1{font-size:20px}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}
@media(min-width:768px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.kpi span{display:block;font-size:12px;font-weight:600;color:var(--mute)}
.kpi b{display:block;font-size:26px;font-weight:800;line-height:1.15;margin-top:4px;letter-spacing:-.02em}
.kpi b small{font-size:14px;font-weight:700;color:var(--mute)}
.kpi em{font-style:normal;font-size:12px;font-weight:700;color:var(--mute)}
.kpi em.bad{color:var(--bad)}.kpi em.ok{color:var(--ok)}
.grp{display:flex;align-items:baseline;gap:8px;margin:22px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.grp h2{font-size:14px;font-weight:800}.grp span{font-size:12px;font-weight:700;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:768px){.grid{grid-template-columns:repeat(3,1fr);gap:12px}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-height:128px}
.card:hover{border-color:var(--brand)}.card:active{transform:scale(.97)}
.card.nodata{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 6%,var(--card))}
.ct{display:flex;align-items:center;justify-content:space-between}
.eq{width:34px;height:34px;border-radius:10px;background:var(--brandsoft);color:var(--brand);display:flex;align-items:center;justify-content:center}
.eq svg{width:21px;height:21px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.cn{font-size:13px;font-weight:800;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cl{font-size:11px;font-weight:600;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch{display:flex;align-items:baseline;gap:4px;margin-top:auto}
.ch b{font-size:20px;font-weight:800;letter-spacing:-.02em}.ch small{font-size:11px;font-weight:700;color:var(--mute)}
.ch b.bad{color:var(--bad);font-size:13px}
.prog{height:5px;border-radius:9px;background:var(--soft);overflow:hidden}.prog i{display:block;height:100%;background:var(--bar);border-radius:9px;transition:width .5s}
.sk{border-radius:16px;min-height:128px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{grid-column:1/-1;text-align:center;padding:56px 16px;background:var(--card);border:1px dashed var(--line);border-radius:16px;color:var(--mute)}
.empty svg{width:40px;height:40px;margin:0 auto 10px;display:block;opacity:.6}
.empty b{display:block;color:var(--tx);font-size:15px;margin-bottom:4px}.empty p{font-size:13px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--mute) 16%,transparent);color:var(--mute)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(2,6,17,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;transition:opacity .2s}
@media(min-width:640px){.ov{align-items:center;padding:16px}}
.ov.hidden{display:none}.ov.out{opacity:0}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;animation:up .28s cubic-bezier(.16,1,.3,1)}
@media(min-width:640px){.sheet{border-radius:24px}}
.ov.out .sheet{animation:down .2s forwards}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes down{to{transform:translateY(40px);opacity:0}}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.sh small{font-size:12px;font-weight:700;color:var(--brand)}.sh h2{font-size:19px;font-weight:800;line-height:1.2;margin-top:2px}
.sb{padding:16px 20px 28px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.nav{display:flex;align-items:center;justify-content:space-between;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:6px}
.nav div{text-align:center}.nav small{display:block;font-size:11px;font-weight:600;color:var(--mute)}.nav b{font-size:15px;font-weight:800}
.box{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}.row:last-child{padding-bottom:0}
.row span{color:var(--mute);font-weight:600}.row b{text-align:right;font-weight:700}
.hero{background:var(--brandsoft);border:1px solid color-mix(in srgb,var(--brand) 35%,transparent);border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:flex-end}
.hero small{font-size:12px;font-weight:700;color:var(--mute);display:block}
.hero b{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.1;color:var(--brand)}
.hero b u{text-decoration:none;font-size:15px;color:var(--mute);margin-left:4px}
.hero div:last-child{text-align:right}.hero div:last-child b{font-size:22px;color:var(--tx)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .box small{font-size:12px;font-weight:600;color:var(--mute);display:block}.two .box b{font-size:17px;font-weight:800}
.sec{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;margin-bottom:10px}
.sec span:last-child{font-weight:700;color:var(--brand)}
.plot{position:relative;height:76px;display:flex;gap:6px;align-items:flex-end}
.plot button{flex:1;height:100%;display:flex;align-items:flex-end;background:var(--card);border-radius:8px;padding:2px;overflow:hidden}
.plot i{display:block;width:100%;border-radius:6px;background:var(--bar);opacity:.65;transition:height .5s}
.plot button.act i{opacity:1;background:var(--brand)}.plot button.z i{background:var(--bad);opacity:.8}
.avg{position:absolute;left:0;right:0;border-top:2px dashed var(--mute);pointer-events:none;opacity:.7}
.lbl{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px;text-align:center;font-size:10.5px;font-weight:600;color:var(--mute);line-height:1.3}
.lbl .on{color:var(--tx);font-weight:800}
#gdet{margin-top:8px;text-align:center;font-size:12px;font-weight:700}
.hi{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12px}
.hi .l1{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:13px}
.hi .l2{display:flex;justify-content:space-between;gap:8px;margin-top:6px;color:var(--mute);font-weight:600}
.hi .l2 b{color:var(--tx)}
.theme{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:6px}
.theme button{padding:10px 4px;border-radius:12px;font-size:12px;font-weight:700;color:var(--mute)}
.theme button.on{background:var(--tx);color:var(--bg)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="top">
 <div class="wrap">
  <header class="head">
   <div class="brand">
    <img src="bautista.png" alt="Grupo Bautista" onerror="this.style.display='none'">
    <div><h1>GRUPO BAUTISTA</h1><p>Control de Maquinaria</p></div>
   </div>
   <div class="tools">
    <button class="ibtn" id="f-ant" aria-label="Día anterior"><svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg></button>
    <select id="selector-fecha" aria-label="Fecha"><option>Cargando...</option></select>
    <button class="ibtn" id="f-sig" aria-label="Día siguiente"><svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg></button>
    <button class="ibtn" onclick="location.reload()" aria-label="Refrescar datos" title="Refrescar datos"><svg fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8 8 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8 8 0 01-15.357-2m15.357 2H15"/></svg></button>
    <button class="ibtn" onclick="abrir('modal-config')" aria-label="Configuración" title="Configuración"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg></button>
   </div>
  </header>
  <div class="bar2">
   <div class="chips" id="chips"><button class="chip on" data-f="TODOS">TODOS</button></div>
   <div class="search">
    <svg class="ic" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    <input id="buscador" type="text" placeholder="Buscar equipo o maquinaria..." autocomplete="off">
    <button id="x" class="hidden" style="display:none" aria-label="Borrar búsqueda"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
   </div>
  </div>
 </div>
</div>

<main class="wrap">
 <section class="kpis" id="kpis"></section>
 <div id="lista"></div>
</main>

<div id="modal-config" class="ov hidden">
 <div class="sheet">
  <div class="sh"><div><small>Preferencias</small><h2>Configuración</h2></div><button class="ibtn" onclick="cerrar('modal-config')" aria-label="Cerrar">✕</button></div>
  <div class="sb">
   <div><div class="sec"><span>Apariencia</span></div>
    <div class="theme"><button data-t="light">Claro</button><button data-t="dark">Oscuro</button><button data-t="auto">Automático</button></div></div>
   <div class="box"><div class="sec"><span>Info de App</span></div><p style="font-size:13px;font-weight:600;color:var(--mute)">Aplicación desarrollada por Fernando Carranza para el Grupo Bautista.</p></div>
  </div>
 </div>
</div>

<div id="modal-detalle" class="ov hidden">
 <div class="sheet">
  <div class="sh"><div><small>Grupo Bautista • Ficha</small><h2 id="m-titulo">--</h2></div><button class="ibtn" onclick="cerrar('modal-detalle')" aria-label="Cerrar ficha">✕</button></div>
  <div class="sb" id="m-cuerpo"></div>
 </div>
</div>

<script>
const URL_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vReJl2BT_9uiaFmB-U1-UlhHKE9lSmhK8jB2bF1Pu1MlM0B15O2H5WxM_ot85WtTIol4_bVhuudvcHU/pub?gid=1193959640&single=true&output=csv";
const $=id=>document.getElementById(id);
const DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
let regs=[],fechas=[],filtro='TODOS',mUnidad='',mFecha='';

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v||'').replace(',','.').replace(/[^\d.-]/g,''));return isNaN(n)?0:n};
const fmt=n=>(Math.round(n*10)/10).toString().replace('.',',');
const pf=f=>{const p=f.split(/[\/\-]/).map(Number);let y=p[2];if(y<100)y+=2000;return new Date(y,p[1]-1,p[0])};
const dia=f=>DIAS[pf(f).getDay()];
const corta=f=>f.split(/[\/\-]/).slice(0,2).join('/');

/* ---------- Tema ---------- */
function aplicarTema(m){
 const o=matchMedia('(prefers-color-scheme: dark)').matches;
 document.documentElement.classList.toggle('dark',m==='dark'||(m==='auto'&&o));
 document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===m));
}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{localStorage.setItem('gb_tema',b.dataset.t);aplicarTema(b.dataset.t)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if((localStorage.getItem('gb_tema')||'auto')==='auto')aplicarTema('auto')});
aplicarTema(localStorage.getItem('gb_tema')||'auto');

/* ---------- Modales con animación de salida ---------- */
function abrir(id){const m=$(id);m.classList.remove('out','hidden')}
function cerrar(id){const m=$(id);if(m.classList.contains('hidden'))return;m.classList.add('out');setTimeout(()=>{m.classList.add('hidden');m.classList.remove('out')},200)}
$('modal-config').addEventListener('click',e=>{if(e.target===e.currentTarget)cerrar('modal-config')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){cerrar('modal-detalle');cerrar('modal-config')}});

/* ---------- Utilidades de equipo ---------- */
function estado(t){
 const s=(t||'').toLowerCase();
 if(!s||s==='sin registro'||s==='-')return{c:'',l:'Sin registro'};
 if(/inoper|aver|falla|malo|parad|fuera/.test(s))return{c:'bad',l:t};
 if(/mant|repar|taller|revis/.test(s))return{c:'warn',l:t};
 if(/oper|bueno|ok|normal|disponible/.test(s))return{c:'ok',l:t};
 return{c:'',l:t};
}
const pill=t=>{const e=estado(t);return`<span class="pill ${e.c}">${esc(e.l)}</span>`};
function icono(n){
 const s=n.toLowerCase();
 let p;
 if(/excav|retro/.test(s))p='<path d="M3 18h11v3H3zM5 18v-5h5l2 3M12 14l4-8 4 3-2 5"/>';
 else if(/volq|camion|camión|cisterna/.test(s))p='<path d="M2 16V7h10v9M12 10h5l4 4v2h-9"/><circle cx="6" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>';
 else if(/carg|pala/.test(s))p='<path d="M3 16h9v4H3zM12 13l4-7h4M16 6l-1 8h5"/>';
 else if(/rodillo|compact/.test(s))p='<circle cx="7" cy="16" r="4"/><circle cx="18" cy="17" r="3"/><path d="M7 12h6l3 2"/>';
 else if(/motoniv|tractor|bulldozer|dozer/.test(s))p='<path d="M3 15h14v4H3zM6 15v-4h6l2 4M17 17h4"/>';
 else p='<path d="M4 17h16v3H4zM7 17v-6h6l3 6"/>';
 return`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
}

/* ---------- Carga de datos ---------- */
function esqueleto(){
 $('kpis').innerHTML=Array(4).fill('<div class="sk" style="min-height:92px"></div>').join('');
 $('lista').innerHTML='<div class="grid">'+Array(8).fill('<div class="sk"></div>').join('')+'</div>';
}
esqueleto();

Papa.parse(URL_CSV,{download:true,header:false,
 complete(res){
  const rows=res.data;if(!rows||!rows.length)return;
  const set=new Set();let vigente='Sin Fecha';
  rows.forEach(row=>{
   if(!row||!row.length)return;
   for(let j=0;j<Math.min(row.length,6);j++){
    const c=row[j]?row[j].trim():'';
    if(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/.test(c)){vigente=c;set.add(c);break}
   }
   if(row.length<8)return;
   const u=row[7]?row[7].trim():'';
   if(!u||/^(UNIDAD|EQUIPO)$/i.test(u)||u.toUpperCase().includes('REPORTE'))return;
   regs.push({fechaFiltro:vigente,lugar:row[0]?row[0].trim():'Sin ubicación',unidad:u,
    operador:row[6]?row[6].trim():'No asignado',hInicial:row[8]?row[8].trim():'-',hFinal:row[9]?row[9].trim():'-',
    totalHoras:row[10]?row[10].trim():'0',estadoMtto:row[11]?row[11].trim():'Sin registro',combustible:row[12]?row[12].trim():'0 Gal'});
  });
  fechas=[...set];
  const sel=$('selector-fecha');
  sel.innerHTML=fechas.length?fechas.map(f=>`<option value="${f}">${dia(f)} ${f}</option>`).join(''):'<option value="">No hay fechas</option>';
  if(fechas.length)sel.value=fechas[fechas.length-1];
  const h=new Date();
  document.querySelector('.brand p').insertAdjacentHTML('afterend',`<span class="upd n">Actualizado ${String(h.getHours()).padStart(2,'0')}:${String(h.getMinutes()).padStart(2,'0')}</span>`);
  vista();
 },
 error(){$('kpis').innerHTML='';$('lista').innerHTML='<div class="grid"><div class="empty"><b>No se pudieron leer los datos</b><p>Revisa tu conexión y toca «Refrescar datos».</p></div></div>'}
});

/* ---------- Vista principal ---------- */
function nav(){
 const i=fechas.indexOf($('selector-fecha').value);
 $('f-ant').disabled=i<=0;$('f-sig').disabled=i<0||i>=fechas.length-1;
}
$('f-ant').onclick=()=>{const s=$('selector-fecha');s.value=fechas[fechas.indexOf(s.value)-1];vista()};
$('f-sig').onclick=()=>{const s=$('selector-fecha');s.value=fechas[fechas.indexOf(s.value)+1];vista()};
$('selector-fecha').addEventListener('change',vista);
$('buscador').addEventListener('input',function(){$('x').style.display=this.value?'block':'none';vista()});
$('x').onclick=()=>{$('buscador').value='';$('x').style.display='none';vista();$('buscador').focus()};
$('chips').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(b){filtro=b.dataset.f;vista()}});

function prio(n){return n==='CARRETERA CHIPULUC'?1:n==='OLMOS'?2:3}

function vista(){
 nav();
 const fecha=$('selector-fecha').value,q=$('buscador').value.toLowerCase();
 const delDia=regs.filter(r=>r.fechaFiltro===fecha);
 const lugares=[...new Set(delDia.map(r=>r.lugar.trim().toUpperCase()).filter(l=>l&&!/^SIN UBICACI/.test(l)))]
  .sort((a,b)=>prio(a)-prio(b)||a.localeCompare(b,'es'));
 if(filtro!=='TODOS'&&!lugares.includes(filtro))filtro='TODOS';
 $('chips').innerHTML=['TODOS',...lugares].map(o=>`<button class="chip ${o===filtro?'on':''}" data-f="${esc(o)}">${esc(o)}</button>`).join('');

 const base=filtro==='TODOS'?delDia:delDia.filter(r=>r.lugar.trim().toUpperCase()===filtro);
 kpis(base);
 const lista=base.filter(r=>r.unidad.toLowerCase().includes(q));
 if(!lista.length){
  $('lista').innerHTML='<div class="grid"><div class="empty"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg><b>No hay máquinas para esta búsqueda</b><p>Prueba con otro nombre, otra ubicación u otra fecha.</p></div></div>';
  return;
 }
 const maxH=Math.max(...lista.map(r=>num(r.totalHoras)),1);
 if(filtro==='TODOS'){
  const g={};lista.forEach(r=>{(g[r.lugar.trim().toUpperCase()]=g[r.lugar.trim().toUpperCase()]||[]).push(r)});
  $('lista').innerHTML=Object.keys(g).sort((a,b)=>prio(a)-prio(b)||a.localeCompare(b,'es')).map(k=>
   `<div class="grp"><h2>${esc(k)}</h2><span>${g[k].length} ${g[k].length===1?'equipo':'equipos'}</span></div><div class="grid">${g[k].map(r=>tarjeta(r,maxH,false)).join('')}</div>`).join('');
 }else{
  $('lista').innerHTML=`<div class="grid" style="margin-top:4px">${lista.map(r=>tarjeta(r,maxH,true)).join('')}</div>`;
 }
}

function kpis(base){
 const conData=base.filter(r=>num(r.totalHoras)>0);
 const horas=conData.reduce((a,r)=>a+num(r.totalHoras),0);
 const comb=base.reduce((a,r)=>a+num(r.combustible),0);
 const sin=base.length-conData.length;
 $('kpis').innerHTML=`
  <div class="kpi"><span>Equipos operativos</span><b class="n">${conData.length} <small>/ ${base.length}</small></b><em class="${sin?'bad':'ok'}">${sin?sin+' sin data hoy':'Todos con data'}</em></div>
  <div class="kpi"><span>Horas totales del día</span><b class="n">${fmt(horas)} <small>hrs</small></b><em>Suma de todos los equipos</em></div>
  <div class="kpi"><span>Combustible total</span><b class="n">${fmt(comb)} <small>Gal</small></b><em>Consumo del día</em></div>
  <div class="kpi"><span>Promedio por equipo</span><b class="n">${conData.length?fmt(horas/conData.length):'0'} <small>hrs</small></b><em>Equipos con data</em></div>`;
}

function tarjeta(r,maxH,ocultaLugar){
 const h=num(r.totalHoras),sin=h===0,e=estado(r.estadoMtto);
 return`<button class="card ${sin?'nodata':''}" onclick="abrirDetalle(${regs.indexOf(r)})">
  <div class="ct"><div class="eq">${icono(r.unidad)}</div><span class="dot ${sin?'bad':e.c}" title="${esc(e.l)}"></span></div>
  <div><div class="cn">${esc(r.unidad)}</div>${ocultaLugar?'':`<div class="cl">${esc(r.lugar)}</div>`}</div>
  <div class="ch">${sin?'<b class="bad">Sin data hoy</b>':`<b class="n">${fmt(h)}</b><small>hrs</small>`}</div>
  <div class="prog"><i style="width:${sin?0:Math.max(h/maxH*100,6)}%"></i></div>
 </button>`;
}

/* ---------- Ficha ---------- */
function abrirDetalle(i){
 const m=regs[i];mUnidad=m.unidad;mFecha=m.fechaFiltro;
 renderFicha();abrir('modal-detalle');$('m-cuerpo').scrollTop=0;
}
function renderFicha(){
 const u=mUnidad,reg=regs.filter(r=>r.unidad===u);
 const m=reg.find(r=>r.fechaFiltro===mFecha);
 $('m-titulo').textContent=u;
 const fl=reg.map(r=>r.fechaFiltro),ix=fl.indexOf(mFecha);
 const ult=reg.slice(Math.max(0,ix-6),ix+1);
 const v=ult.map(r=>num(r.totalHoras)),max=Math.max(...v,1),avg=v.reduce((a,b)=>a+b,0)/v.length;
 const hist=reg.slice().reverse();
 $('m-cuerpo').innerHTML=`
  <div class="nav">
   <button class="ibtn" id="m-ant" ${ix<=0?'disabled':''} aria-label="Registro anterior">‹</button>
   <div><small>Fecha del registro</small><b class="n">${dia(mFecha)} ${mFecha}</b></div>
   <button class="ibtn" id="m-sig" ${ix>=fl.length-1?'disabled':''} aria-label="Registro siguiente">›</button>
  </div>
  <div class="hero">
   <div><small>Horas totales</small><b class="n">${esc(m.totalHoras)}<u>hrs</u></b></div>
   <div><small>Combustible</small><b class="n">${esc(m.combustible||'0 Gal')}</b></div>
  </div>
  <div class="box">
   <div class="row"><span>Ubicación</span><b>${esc(m.lugar)}</b></div>
   <div class="row"><span>Operador</span><b>${esc(m.operador||'Sin registro')}</b></div>
   <div class="row"><span>Estado para Mtto</span>${pill(m.estadoMtto)}</div>
  </div>
  <div class="two">
   <div class="box"><small>Horómetro inicial</small><b class="n">${esc(m.hInicial)}</b></div>
   <div class="box"><small>Horómetro final</small><b class="n">${esc(m.hFinal)}</b></div>
  </div>
  <div class="box">
   <div class="sec"><span>Horas trabajadas • Últimos ${ult.length} días</span><span class="n">Prom: ${fmt(avg)} hrs</span></div>
   <div class="plot">
    ${ult.map((r,k)=>`<button data-k="${k}" class="${r.fechaFiltro===mFecha?'act':''} ${v[k]===0?'z':''}" aria-label="${r.fechaFiltro}: ${fmt(v[k])} horas"><i style="height:${v[k]>0?Math.max(v[k]/max*100,8):4}%"></i></button>`).join('')}
    <div class="avg" style="bottom:calc(${avg/max*100}% * .9 + 2px)"></div>
   </div>
   <div class="lbl n">${ult.map(r=>`<div class="${r.fechaFiltro===mFecha?'on':''}">${dia(r.fechaFiltro)}<br>${corta(r.fechaFiltro)}</div>`).join('')}</div>
   <div id="gdet" class="n">${dia(mFecha)} ${corta(mFecha)} · ${fmt(num(m.totalHoras))} hrs</div>
  </div>
  <div>
   <div class="sec"><span>Registros completos de la unidad</span><span class="pill n">${hist.length} ${hist.length===1?'registro':'registros'}</span></div>
   <div style="display:flex;flex-direction:column;gap:8px">
   ${hist.map(r=>`<div class="hi">
     <div class="l1"><span class="n">${dia(r.fechaFiltro)} ${r.fechaFiltro}</span>${pill(r.estadoMtto)}</div>
     <div class="l2"><span>${esc(r.lugar)}</span><span><b class="n">${esc(r.totalHoras)} hrs</b> · <span class="n">${esc(r.combustible||'0 Gal')}</span></span></div>
     <div class="l2"><span>${esc(r.operador||'Sin registro')}</span><span class="n">${esc(r.hInicial)} → ${esc(r.hFinal)}</span></div>
   </div>`).join('')}
   </div>
  </div>`;
 const a=$('m-ant'),s=$('m-sig');
 a.onclick=()=>{mFecha=fl[ix-1];renderFicha()};
 s.onclick=()=>{mFecha=fl[ix+1];renderFicha()};
 document.querySelectorAll('.plot button').forEach(b=>b.onclick=()=>{
  const r=ult[b.dataset.k];
  $('gdet').textContent=`${dia(r.fechaFiltro)} ${corta(r.fechaFiltro)} · ${fmt(num(r.totalHoras))} hrs`;
  document.querySelectorAll('.plot button').forEach(x=>x.classList.remove('act'));b.classList.add('act');
 });
}
</script>
</body>
</html>
