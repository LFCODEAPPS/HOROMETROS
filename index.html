<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Lugares - Google Sheets</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse para procesar CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-indigo-600">Visualizador de Datos: Lugares</h1>
            <p class="text-slate-500 mt-2">Los datos de Google Sheets se han separado en dos secciones según la primera columna.</p>
        </header>

        <!-- Indicador de carga -->
        <div id="loading" class="text-center py-16 text-slate-500 font-medium">
            Conectando con Google Sheets y procesando datos...
        </div>

        <!-- Contenedor de las dos partes -->
        <div id="dashboard" class="grid grid-cols-1 md:grid-cols-2 gap-6 hidden">
            
            <!-- PARTE 1 DE LA COLUMNA -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                    <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2">
                        <span class="w-3 h-3 bg-indigo-500 rounded-full"></span> 
                        Parte 1: Categoría / Zona Principal
                    </h2>
                    <span id="count-1" class="bg-indigo-50 text-indigo-700 text-xs font-semibold px-2.5 py-1 rounded-full">0</span>
                </div>
                <div id="list-1" class="space-y-3 overflow-y-auto max-h-[600px] pr-2"></div>
            </div>

            <!-- PARTE 2 DE LA COLUMNA -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                    <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2">
                        <span class="w-3 h-3 bg-emerald-500 rounded-full"></span> 
                        Parte 2: Sub-lugar / Detalle
                    </h2>
                    <span id="count-2" class="bg-emerald-50 text-emerald-700 text-xs font-semibold px-2.5 py-1 rounded-full">0</span>
                </div>
                <div id="list-2" class="space-y-3 overflow-y-auto max-h-[600px] pr-2"></div>
            </div>

        </div>
    </div>

    <script>
        // Enlace CSV generado a partir de tu enlace de Google Sheets publicado
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vReJl2BT_9uiaFmB-U1-UlhHKE9lSmhK8jB2bF1Pu1MlM0B15O2H5WxM_ot85WtTIol4_bVhuudvcHU/pub?gid=1193959640&single=true&output=csv";

        Papa.parse(SHEET_CSV_URL, {
            download: true,
            header: false,
            complete: function(results) {
                const rows = results.data;
                if (!rows || rows.length === 0) return;

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');

                const container1 = document.getElementById('list-1');
                const container2 = document.getElementById('list-2');

                let html1 = '';
                let html2 = '';
                let validCount = 0;

                // Empezamos desde i = 1 para saltar la cabecera
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length === 0 || !row[0]) continue;

                    validCount++;
                    const lugarOriginal = row[0].trim();

                    // Separar el texto de la primera columna en dos partes.
                    // Si contiene un guion ("-"), divide por él. Si no, divide por el primer espacio.
                    let parteA = lugarOriginal;
                    let parteB = "Detalle general";

                    if (lugarOriginal.includes('-')) {
                        const partes = lugarOriginal.split('-');
                        parteA = partes[0].trim();
                        parteB = partes.slice(1).join('-').trim();
                    } else if (lugarOriginal.includes(' ')) {
                        const espacioIdx = lugarOriginal.indexOf(' ');
                        parteA = lugarOriginal.substring(0, espacioIdx).trim();
                        parteB = lugarOriginal.substring(espacioIdx + 1).trim();
                    }

                    // Recolectar el resto de columnas de esa fila para mostrarlas como información adicional
                    let infoAdicional = '';
                    for (let j = 1; j < row.length; j++) {
                        if (row[j] && row[j].trim() !== '') {
                            infoAdicional += `<span class="inline-block bg-slate-100 text-slate-600 text-xs px-2 py-0.5 rounded mr-1 mb-1">Col ${j+1}: ${row[j]}</span>`;
                        }
                    }

                    // Tarjeta para la Parte 1
                    html1 += `
                        <div class="p-4 rounded-xl border border-slate-100 bg-slate-50/50 hover:bg-slate-50 transition">
                            <div class="font-bold text-indigo-900 text-base">${parteA}</div>
                            <div class="text-xs text-slate-400 mt-0.5">Completo: ${lugarOriginal}</div>
                            <div class="mt-2">${infoAdicional}</div>
                        </div>
                    `;

                    // Tarjeta para la Parte 2
                    html2 += `
                        <div class="p-4 rounded-xl border border-slate-100 bg-slate-50/50 hover:bg-slate-50 transition">
                            <div class="font-bold text-emerald-900 text-base">${parteB}</div>
                            <div class="text-xs text-slate-400 mt-0.5">Categoría base: ${parteA}</div>
                            <div class="mt-2">${infoAdicional}</div>
                        </div>
                    `;
                }

                container1.innerHTML = html1;
                container2.innerHTML = html2;
                document.getElementById('count-1').innerText = `${validCount} ítems`;
                document.getElementById('count-2').innerText = `${validCount} ítems`;
            },
            error: function(err) {
                document.getElementById('loading').innerHTML = `<span class="text-red-500">Error al leer los datos de la hoja. Verifica que esté publicada correctamente en la web.</span>`;
                console.error(err);
            }
        });
    </script>
</body>
</html>
