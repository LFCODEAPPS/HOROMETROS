<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- BLOQUEO DE ZOOM -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control De Maquinaria Grupo Bautista</title>
    
    <!-- ÍCONOS PARA ACCESO DIRECTO EN iOS Y ANDROID -->
    <link rel="icon" type="image/png" href="bautista.png">
    <link rel="apple-touch-icon" href="bautista.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Grupo Bautista">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            touch-action: manipulation;
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'media',
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen pb-12 font-sans transition-colors duration-300">

    <!-- BLOQUE SUPERIOR FIJO COMPLETO CON MÁS ESPACIO -->
    <div class="sticky top-0 z-30 bg-white/95 dark:bg-slate-950/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm">
        
        <!-- 1. Encabezado Principal Amplio -->
        <header class="max-w-xl mx-auto px-4 pt-4 pb-3.5 flex justify-between items-center gap-3">
            
            <!-- Izquierda: Logo + Título -->
            <div class="flex items-center gap-3 flex-1 min-w-0">
                <div class="h-12 w-12 rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-1.5 flex items-center justify-center overflow-hidden shadow-sm shrink-0">
                    <img src="bautista.png" alt="Logo Grupo Bautista" class="h-full w-full object-contain" onerror="this.parentElement.style.display='none'">
                </div>
                <div class="min-w-0">
                    <h1 class="text-sm sm:text-base font-extrabold text-emerald-600 dark:text-emerald-400 leading-snug truncate">
                        Control De Maquinaria
                    </h1>
                    <p class="text-xs font-bold text-slate-700 dark:text-slate-200 leading-tight">
                        Grupo Bautista
                    </p>
                    <p class="text-[10px] text-slate-500 dark:text-slate-400 mt-0.5 truncate">Cambia de fecha 👉</p>
                </div>
            </div>
            
            <!-- Derecha: Botón Recarga + Selector de Fecha -->
            <div class="flex items-center gap-2 shrink-0">
                <button onclick="location.reload()" class="p-2 text-slate-500 hover:text-emerald-600 dark:text-slate-400 dark:hover:text-emerald-400 transition bg-slate-100 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700" title="Actualizar datos">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>

                <div class="relative">
                    <select id="selector-fecha" class="bg-emerald-100 text-emerald-900 dark:bg-emerald-600 dark:text-slate-950 font-black text-xs px-3 py-2.5 rounded-xl shadow-sm border border-emerald-200 dark:border-emerald-500 focus:ring-2 focus:ring-emerald-400 cursor-pointer outline-none text-center appearance-none pr-7">
                        <option value="">Cargando...</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-emerald-800 dark:text-slate-900">
                        <svg class="fill-current h-3.5 w-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                    </div>
                </div>
            </div>
        </header>

        <!-- 2. Filtros y Barra de Búsqueda con más aire -->
        <div class="max-w-xl mx-auto px-4 pb-4 space-y-3">
            <!-- Botones de Filtro por Ubicación -->
            <div class="flex overflow-x-auto gap-2 hide-scrollbar" id="botones-categoria">
                <button onclick="filtrarPorUbicacion('TODOS', this)" class="btn-filtro bg-emerald-500 text-white dark:text-slate-900 border-emerald-500 font-bold px-4 py-2 rounded-full text-xs shrink-0 transition shadow-sm border">TODOS</button>
                <button onclick="filtrarPorUbicacion('CARRETERA CHIPULUC', this)" class="btn-filtro bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 font-semibold px-4 py-2 rounded-full text-xs shrink-0 transition hover:bg-slate-200 dark:hover:bg-slate-700 border">CARRETERA CHIPULUC</button>
                <button onclick="filtrarPorUbicacion('OLMOS', this)" class="btn-filtro bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 font-semibold px-4 py-2 rounded-full text-xs shrink-0 transition hover:bg-slate-200 dark:hover:bg-slate-700 border">OLMOS</button>
                <button onclick="filtrarPorUbicacion('OTROS', this)" class="btn-filtro bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 font-semibold px-4 py-2 rounded-full text-xs shrink-0 transition hover:bg-slate-200 dark:hover:bg-slate-700 border">OTROS</button>
            </div>

            <!-- Buscador de Equipos -->
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400 text-sm">🔍</span>
                <input type="text" id="buscador" placeholder="Buscar equipo o maquinaria..." 
                    class="w-full bg-slate-100/80 dark:bg-slate-900 border border-slate-200 dark:border-slate-700/80 text-sm rounded-xl pl-10 pr-4 py-2.5 text-slate-800 dark:text-white focus:outline-none focus:border-emerald-500 focus:bg-white dark:focus:bg-slate-800 transition">
            </div>
        </div>

    </div>

    <!-- CONTENIDO DESPLAZABLE -->
    <main class="max-w-xl mx-auto p-4">

        <!-- Pantalla de Carga con Logo -->
        <div id="loading" class="flex flex-col items-center justify-center py-20 text-center space-y-4">
            <div class="w-24 h-24 rounded-2xl bg-white dark:bg-slate-800 p-3 shadow-md border border-slate-200 dark:border-slate-700 flex items-center justify-center animate-pulse">
                <img src="bautista.png" alt="Cargando Grupo Bautista" class="max-h-full max-w-full object-contain" onerror="this.parentElement.style.display='none'">
            </div>
            <p class="text-slate-500 dark:text-slate-400 text-sm font-medium animate-pulse">
                Espere unos segundos mientras carga el sistema...
            </p>
        </div>

        <!-- Cuadrícula de Botones de Máquinas -->
        <div id="grid-maquinas" class="grid grid-cols-2 gap-2.5 hidden">
            <!-- Los botones se inyectarán aquí -->
        </div>

    </main>

    <!-- Modal / Tarjeta de Detalle -->
    <div id="modal-detalle" class="fixed inset-0 bg-slate-900/40 dark:bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-4 relative">
            
            <div class="flex justify-between items-start border-b border-slate-100 dark:border-slate-700 pb-3">
                <div>
                    <span class="text-[10px] uppercase tracking-wider text-emerald-600 dark:text-emerald-400 font-bold">Detalle de Unidad</span>
                    <h2 id="modal-titulo" class="text-base font-extrabold text-slate-900 dark:text-white mt-0.5 leading-tight">Nombre de Máquina</h2>
                </div>
                <button onclick="cerrarModal()" class="bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm transition shrink-0 ml-2">
                    ✕
                </button>
            </div>

            <!-- Controles de Navegación por Fecha -->
            <div class="flex items-center justify-between bg-slate-50 dark:bg-slate-900/60 p-2 rounded-xl border border-slate-200 dark:border-emerald-900/30">
                <button id="btn-fecha-ant" class="p-2 text-emerald-600 dark:text-emerald-500 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition disabled:opacity-30 disabled:hover:bg-transparent">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <div class="text-center flex-1">
                    <span class="block text-[9px] text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-0.5">Fecha del Registro</span>
                    <span id="modal-fecha-actual" class="font-bold text-emerald-600 dark:text-emerald-400 text-sm">--/--/--</span>
                </div>
                <button id="btn-fecha-sig" class="p-2 text-emerald-600 dark:text-emerald-500 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition disabled:opacity-30 disabled:hover:bg-transparent">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>

            <!-- Datos Ordenados -->
            <div class="space-y-2.5 text-xs md:text-sm">
                
                <div class="bg-slate-50 dark:bg-slate-900/80 p-2.5 rounded-xl border border-slate-100 dark:border-slate-700/50 flex justify-between items-center">
                    <span class="text-slate-500 dark:text-slate-400 text-xs">📍 Lugar:</span>
                    <span id="modal-lugar" class="font-semibold text-slate-800 dark:text-white text-right break-words max-w-[70%]">--</span>
                </div>

                <div class="bg-slate-50 dark:bg-slate-900/80 p-2.5 rounded-xl border border-slate-100 dark:border-slate-700/50 flex justify-between items-center">
                    <span class="text-slate-500 dark:text-slate-400 text-xs">👤 Operador:</span>
                    <span id="modal-operador" class="font-semibold text-slate-800 dark:text-white text-right truncate pl-2">--</span>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div class="bg-slate-50 dark:bg-slate-900/80 p-2.5 rounded-xl border border-slate-100 dark:border-slate-700/50">
                        <span class="text-slate-500 dark:text-slate-400 text-[11px] block mb-1">⏱️ H. Inicial:</span>
                        <span id="modal-hinicial" class="font-bold text-emerald-600 dark:text-emerald-300 text-sm">--</span>
                    </div>
                    <div class="bg-slate-50 dark:bg-slate-900/80 p-2.5 rounded-xl border border-slate-100 dark:border-slate-700/50">
                        <span class="text-slate-500 dark:text-slate-400 text-[11px] block mb-1">⏱️ H. Final:</span>
                        <span id="modal-hfinal" class="font-bold text-emerald-600 dark:text-emerald-300 text-sm">--</span>
                    </div>
                </div>

                <div class="bg-slate-50 dark:bg-slate-900/80 p-2.5 rounded-xl border border-slate-100 dark:border-slate-700/50 flex justify-between items-center">
                    <span class="text-slate-500 dark:text-slate-400 text-xs">📊 Horas Totales:</span>
                    <span id="modal-totales" class="font-bold text-blue-600 dark:text-blue-400 text-sm">--</span>
                </div>

                <div class="bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800/40 p-2.5 rounded-xl flex justify-between items-center">
                    <span class="text-amber-800 dark:text-amber-300/80 text-xs font-medium">⛽ Combustible:</span>
                    <span id="modal-combustible" class="font-black text-amber-600 dark:text-amber-400 text-sm">--</span>
                </div>
            </div>

            <button onclick="cerrarModal()" class="w-full bg-emerald-500 hover:bg-emerald-600 dark:bg-emerald-600 dark:hover:bg-emerald-500 text-white dark:text-slate-950 font-bold py-2.5 rounded-xl transition text-sm shadow-md mt-2">
                Aceptar / Cerrar
            </button>
        </div>
    </div>

    <script>
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vReJl2BT_9uiaFmB-U1-UlhHKE9lSmhK8jB2bF1Pu1MlM0B15O2H5WxM_ot85WtTIol4_bVhuudvcHU/pub?gid=1193959640&single=true&output=csv";

        let todosLosRegistros = [];
        let fechasUnicas = []; 
        let fechaVigenteParseo = "Sin Fecha";
        
        let maquinaActualModal = "";
        let fechaActualModal = "";
        let filtroUbicacionActual = "TODOS";

        const paletaLugares = [
            'bg-emerald-100 border-emerald-300 text-emerald-900 dark:bg-emerald-900/40 dark:border-emerald-700 dark:text-emerald-100',
            'bg-blue-100 border-blue-300 text-blue-900 dark:bg-blue-900/40 dark:border-blue-700 dark:text-blue-100',
            'bg-amber-100 border-amber-300 text-amber-900 dark:bg-amber-900/40 dark:border-amber-700 dark:text-amber-100',
            'bg-purple-100 border-purple-300 text-purple-900 dark:bg-purple-900/40 dark:border-purple-700 dark:text-purple-100'
        ];
        
        let mapaColoresLugar = {};
        let contadorLugares = 0;

        Papa.parse(SHEET_CSV_URL, {
            download: true,
            header: false,
            complete: function(results) {
                const rows = results.data;
                if (!rows || rows.length === 0) return;

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('grid-maquinas').classList.remove('hidden');
                
                let fechasEncontradasSet = new Set();

                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length === 0) continue;

                    for (let j = 0; j < Math.min(row.length, 6); j++) {
                        let celda = row[j] ? row[j].trim() : "";
                        if (/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/.test(celda)) {
                            fechaVigenteParseo = celda;
                            fechasEncontradasSet.add(celda);
                            break;
                        }
                    }

                    if (row.length < 8) continue;

                    const lugar = row[0] ? row[0].trim() : 'Sin ubicación'; 
                    const unidad = row[7] ? row[7].trim() : '';             

                    if (!unidad || unidad.toUpperCase() === 'UNIDAD' || unidad.toUpperCase() === 'EQUIPO' || unidad.toUpperCase().includes('REPORTE')) {
                        continue;
                    }

                    todosLosRegistros.push({
                        fechaFiltro: fechaVigenteParseo,
                        lugar: lugar,                                     
                        unidad: unidad,                                   
                        operador: row[6] ? row[6].trim() : 'No asignado', 
                        hInicial: row[8] ? row[8].trim() : '-',           
                        hFinal: row[9] ? row[9].trim() : '-',             
                        totalHoras: row[10] ? row[10].trim() : '0',       
                        combustible: row[12] ? row[12].trim() : '0 Gal'   
                    });
                }

                fechasUnicas = Array.from(fechasEncontradasSet);
                const selector = document.getElementById('selector-fecha');
                selector.innerHTML = '';

                if (fechasUnicas.length > 0) {
                    fechasUnicas.forEach(f => {
                        const opt = document.createElement('option');
                        opt.value = f;
                        opt.innerText = f;
                        selector.appendChild(opt);
                    });
                    selector.value = fechasUnicas[fechasUnicas.length - 1]; 
                } else {
                    selector.innerHTML = '<option value="">No hay fechas</option>';
                }

                actualizarVista();
            },
            error: function(err) {
                document.getElementById('loading').innerHTML = '<span class="text-red-500">Error al leer los datos.</span>';
            }
        });

        function filtrarPorUbicacion(categoria, botonClickado) {
            filtroUbicacionActual = categoria;
            
            const botones = document.querySelectorAll('.btn-filtro');
            botones.forEach(btn => {
                btn.classList.remove('bg-emerald-500', 'text-white', 'dark:text-slate-900', 'border-emerald-500', 'font-bold');
                btn.classList.add('bg-slate-100', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300', 'border-slate-200', 'dark:border-slate-700', 'font-semibold', 'hover:bg-slate-200', 'dark:hover:bg-slate-700');
            });

            botonClickado.classList.remove('bg-slate-100', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300', 'border-slate-200', 'dark:border-slate-700', 'font-semibold', 'hover:bg-slate-200', 'dark:hover:bg-slate-700');
            botonClickado.classList.add('bg-emerald-500', 'text-white', 'dark:text-slate-900', 'border-emerald-500', 'font-bold');

            actualizarVista();
        }

        function actualizarVista() {
            const fechaSeleccionada = document.getElementById('selector-fecha').value;
            const textoBusqueda = document.getElementById('buscador').value.toLowerCase();

            const filtrados = todosLosRegistros.filter(item => {
                const coincideBasico = (item.fechaFiltro === fechaSeleccionada) && item.unidad.toLowerCase().includes(textoBusqueda);
                if (!coincideBasico) return false;

                const lugarUpper = item.lugar.toUpperCase();
                if (filtroUbicacionActual === "TODOS") {
                    return true;
                } else if (filtroUbicacionActual === "CARRETERA CHIPULUC") {
                    return lugarUpper.includes("CARRETERA CHIPULUC");
                } else if (filtroUbicacionActual === "OLMOS") {
                    return lugarUpper.includes("OLMOS");
                } else if (filtroUbicacionActual === "OTROS") {
                    return !lugarUpper.includes("CARRETERA CHIPULUC") && !lugarUpper.includes("OLMOS");
                }
                return true;
            });

            renderizarBotones(filtrados);
        }

        function renderizarBotones(datos) {
            const grid = document.getElementById('grid-maquinas');
            let html = '';

            if (datos.length === 0) {
                grid.innerHTML = '<div class="col-span-2 text-center text-slate-500 dark:text-slate-400 py-16 text-sm bg-white dark:bg-slate-800/30 rounded-xl border border-slate-200 dark:border-slate-800">No se encontraron máquinas.</div>';
                return;
            }

            datos.forEach(item => {
                const indexReal = todosLosRegistros.indexOf(item);
                
                if (!mapaColoresLugar[item.lugar]) {
                    mapaColoresLugar[item.lugar] = paletaLugares[contadorLugares % paletaLugares.length];
                    contadorLugares++;
                }
                const colorClase = mapaColoresLugar[item.lugar];

                html += `
                    <button onclick="abrirDetalle(${indexReal})" class="${colorClase} p-3 rounded-2xl shadow-sm border flex flex-col justify-between items-start text-left transition transform hover:opacity-80 active:scale-95 min-h-[90px] relative overflow-hidden group">
                        <div class="flex justify-between items-start w-full mb-1.5 pl-1.5 gap-2">
                            <span class="text-lg shrink-0 opacity-90 group-hover:scale-110 transition-transform pt-0.5">🚜</span>
                            <span class="text-[9px] font-bold bg-white/60 dark:bg-black/30 border border-black/10 dark:border-white/10 px-1.5 py-0.5 rounded text-right leading-tight max-w-[75%] line-clamp-2">${item.lugar}</span>
                        </div>
                        <span class="font-bold text-[11px] md:text-xs leading-snug pl-1.5 pr-1">${item.unidad}</span>
                    </button>
                `;
            });

            grid.innerHTML = html;
        }

        function abrirDetalle(indexOriginal) {
            const m = todosLosRegistros[indexOriginal];
            maquinaActualModal = m.unidad;
            fechaActualModal = m.fechaFiltro;
            
            cargarDatosEnModal(m);
            actualizarBotonesNavegacionFecha();
            document.getElementById('modal-detalle').classList.remove('hidden');
        }

        function cargarDatosEnModal(m) {
            document.getElementById('modal-titulo').innerText = m.unidad;
            document.getElementById('modal-fecha-actual').innerText = m.fechaFiltro;
            document.getElementById('modal-lugar').innerText = m.lugar;
            document.getElementById('modal-operador').innerText = m.operador || 'Sin registro';
            document.getElementById('modal-hinicial').innerText = m.hInicial;
            document.getElementById('modal-hfinal').innerText = m.hFinal;
            document.getElementById('modal-totales').innerText = m.totalHoras + " hrs";
            document.getElementById('modal-combustible').innerText = m.combustible || '0 Gal';
        }

        function actualizarBotonesNavegacionFecha() {
            const idxFechaActual = fechasUnicas.indexOf(fechaActualModal);
            const btnAnt = document.getElementById('btn-fecha-ant');
            const btnSig = document.getElementById('btn-fecha-sig');

            let indiceAnterior = -1;
            for (let i = idxFechaActual - 1; i >= 0; i--) {
                if (verificarSiMaquinaExisteEnFecha(maquinaActualModal, fechasUnicas[i])) {
                    indiceAnterior = i;
                    break;
                }
            }

            let indiceSiguiente = -1;
            for (let i = idxFechaActual + 1; i < fechasUnicas.length; i++) {
                if (verificarSiMaquinaExisteEnFecha(maquinaActualModal, fechasUnicas[i])) {
                    indiceSiguiente = i;
                    break;
                }
            }

            if (indiceAnterior !== -1) {
                btnAnt.disabled = false;
                btnAnt.onclick = () => saltarAFecha(fechasUnicas[indiceAnterior]);
            } else {
                btnAnt.disabled = true;
                btnAnt.onclick = null;
            }

            if (indiceSiguiente !== -1) {
                btnSig.disabled = false;
                btnSig.onclick = () => saltarAFecha(fechasUnicas[indiceSiguiente]);
            } else {
                btnSig.disabled = true;
                btnSig.onclick = null;
            }
        }

        function verificarSiMaquinaExisteEnFecha(nombreMaquina, fechaFiltro) {
            return todosLosRegistros.some(r => r.unidad === nombreMaquina && r.fechaFiltro === fechaFiltro);
        }

        function saltarAFecha(nuevaFecha) {
            const registroEncontrado = todosLosRegistros.find(r => r.unidad === maquinaActualModal && r.fechaFiltro === nuevaFecha);
            if (registroEncontrado) {
                fechaActualModal = nuevaFecha;
                cargarDatosEnModal(registroEncontrado);
                actualizarBotonesNavegacionFecha();
            }
        }

        function cerrarModal() {
            document.getElementById('modal-detalle').classList.add('hidden');
        }

        document.getElementById('selector-fecha').addEventListener('change', actualizarVista);
        document.getElementById('buscador').addEventListener('input', actualizarVista);
    </script>
</body>
</html>
