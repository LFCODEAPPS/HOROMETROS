<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grupo Bautista | Control de Maquinaria</title>
    
    <!-- ÍCONOS PARA ACCESO DIRECTO EN iOS Y ANDROID -->
    <link rel="icon" type="image/png" href="bautista.png">
    <link rel="apple-touch-icon" href="bautista.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Grupo Bautista">

    <!-- Fuente moderna Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { 
            touch-action: manipulation; 
            -webkit-tap-highlight-color: transparent;
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(14px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes sheetUp {
            from {
                opacity: 0;
                transform: translateY(100%);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (min-width: 640px) {
            @keyframes sheetUp {
                from {
                    opacity: 0;
                    transform: scale(0.94) translateY(12px);
                }
                to {
                    opacity: 1;
                    transform: scale(1) translateY(0);
                }
            }
        }

        .anim-card {
            animation: fadeSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .anim-modal {
            animation: sheetUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-[#F5F5F4] dark:bg-[#0C0D10] text-stone-900 dark:text-stone-100 min-h-screen pb-16 font-sans transition-colors duration-300 antialiased">

    <!-- BLOQUE SUPERIOR FIJO CORPORATIVO (INTACTO) -->
    <div class="sticky top-0 z-30 bg-white/95 dark:bg-[#121317]/95 backdrop-blur-xl border-b border-stone-200/80 dark:border-stone-800/90 shadow-[0_4px_24px_-12px_rgba(0,0,0,0.12)]">
        
        <!-- Línea superior de acento dorado -->
        <div class="h-1 w-full bg-gradient-to-r from-stone-900 via-amber-500 to-stone-900 dark:from-amber-600 dark:via-amber-400 dark:to-amber-600"></div>

        <header class="max-w-xl mx-auto px-4 pt-4 pb-3 space-y-3.5">
            <!-- Fila 1: Identidad Corporativa Grupo Bautista -->
            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-3.5 min-w-0">
                    <!-- Logo con marco ejecutivo -->
                    <div class="h-12 w-12 rounded-2xl bg-stone-950 dark:bg-stone-900 border border-amber-500/40 p-1.5 flex items-center justify-center shrink-0 shadow-md">
                        <img src="bautista.png" alt="Grupo Bautista" class="h-full w-full object-contain" onerror="this.parentElement.style.display='none'">
                    </div>
                    <div class="min-w-0">
                        <h1 class="text-base sm:text-lg font-black text-stone-950 dark:text-white tracking-tight uppercase leading-none truncate">
                            Grupo Bautista
                        </h1>
                        <div class="flex items-center gap-1.5 mt-1">
                            <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
                            <p class="text-xs font-bold text-amber-600 dark:text-amber-400 tracking-wide truncate">
                                Control de Maquinaria
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Botón Recarga Ejecutivo -->
                <button id="btn-recargar" onclick="recargarConAnimacion()" class="h-10 px-3.5 text-stone-700 hover:text-amber-600 dark:text-stone-300 dark:hover:text-amber-400 bg-stone-100 hover:bg-stone-200/70 dark:bg-stone-800/90 dark:hover:bg-slate-800 rounded-xl border border-stone-200 dark:border-stone-700 flex items-center gap-1.5 text-xs font-bold transition active:scale-95 shrink-0" title="Actualizar datos">
                    <svg id="icono-recargar" class="w-4 h-4 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span class="hidden sm:inline">Actualizar</span>
                </button>
            </div>

            <!-- Fila 2: Selector de Fecha Estilo Ejecutivo -->
            <div class="relative">
                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-amber-600 dark:text-amber-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                <select id="selector-fecha" class="w-full bg-amber-500/10 hover:bg-amber-500/15 dark:bg-amber-500/15 dark:hover:bg-amber-500/20 text-stone-900 dark:text-amber-300 font-extrabold text-xs pl-10 pr-9 py-2.5 rounded-xl border border-amber-500/30 focus:ring-2 focus:ring-amber-500/40 cursor-pointer outline-none appearance-none transition">
                    <option value="">Cargando fechas...</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3.5 text-amber-700 dark:text-amber-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                </div>
            </div>
        </header>

        <!-- Filtros por ubicación + Buscador -->
        <div class="max-w-xl mx-auto px-4 pb-3.5 space-y-2.5">
            <div class="flex overflow-x-auto gap-1.5 hide-scrollbar py-0.5" id="botones-categoria">
                <button onclick="filtrarPorUbicacion('TODOS', this)" class="btn-filtro bg-stone-900 dark:bg-amber-500 text-amber-400 dark:text-stone-950 border-stone-900 dark:border-amber-500 font-bold px-4 py-1.5 rounded-full text-[11px] shrink-0 transition-all duration-200 active:scale-95 shadow-sm border">TODOS</button>
                <button onclick="filtrarPorUbicacion('CARRETERA CHIPULUC', this)" class="btn-filtro bg-white dark:bg-stone-800/80 text-stone-600 dark:text-stone-300 border-stone-200 dark:border-stone-700 font-semibold px-4 py-1.5 rounded-full text-[11px] shrink-0 transition-all duration-200 active:scale-95 hover:bg-stone-100 dark:hover:bg-stone-800 border">CARRETERA CHIPULUC</button>
                <button onclick="filtrarPorUbicacion('OLMOS', this)" class="btn-filtro bg-white dark:bg-stone-800/80 text-stone-600 dark:text-stone-300 border-stone-200 dark:border-stone-700 font-semibold px-4 py-1.5 rounded-full text-[11px] shrink-0 transition-all duration-200 active:scale-95 hover:bg-stone-100 dark:hover:bg-stone-800 border">OLMOS</button>
                <button onclick="filtrarPorUbicacion('OTROS', this)" class="btn-filtro bg-white dark:bg-stone-800/80 text-stone-600 dark:text-stone-300 border-stone-200 dark:border-stone-700 font-semibold px-4 py-1.5 rounded-full text-[11px] shrink-0 transition-all duration-200 active:scale-95 hover:bg-stone-100 dark:hover:bg-stone-800 border">OTROS</button>
            </div>

            <div class="relative">
                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-stone-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <input type="text" id="buscador" placeholder="Buscar equipo o maquinaria..." 
                    class="w-full bg-stone-100/80 dark:bg-stone-900/90 border border-stone-200 dark:border-stone-800 text-xs sm:text-sm rounded-xl pl-10 pr-4 py-2.5 text-stone-800 dark:text-white placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-amber-500/30 focus:border-amber-500 focus:bg-white dark:focus:bg-stone-800 transition-all">
            </div>
        </div>

    </div>

    <!-- CONTENIDO DESPLAZABLE -->
    <main class="max-w-xl mx-auto p-4">

        <!-- Pantalla de Carga Corporativa -->
        <div id="loading" class="flex flex-col items-center justify-center py-24 text-center space-y-5">
            <div class="relative">
                <div class="absolute inset-0 bg-amber-500/25 rounded-full blur-xl animate-pulse"></div>
                <div class="relative w-24 h-24 rounded-3xl bg-stone-950 border border-amber-500/40 p-3 shadow-xl flex items-center justify-center animate-bounce">
                    <img src="bautista.png" alt="Grupo Bautista" class="max-h-full max-w-full object-contain" onerror="this.parentElement.style.display='none'">
                </div>
            </div>
            <div class="space-y-1">
                <p class="text-xs font-black uppercase tracking-widest text-amber-600 dark:text-amber-400">Grupo Bautista</p>
                <p class="text-stone-500 dark:text-stone-400 text-sm font-medium animate-pulse">
                    Espere unos segundos mientras carga el sistema...
                </p>
            </div>
        </div>

        <!-- Cuadrícula de Botones de Máquinas -->
        <div id="grid-maquinas" class="grid grid-cols-2 gap-3 hidden">
            <!-- Los botones se inyectarán aquí -->
        </div>

    </main>

    <!-- Modal / Bottom Sheet Corporativo -->
    <div id="modal-detalle" class="fixed inset-0 bg-stone-950/65 dark:bg-black/85 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden transition-opacity duration-200">
        <div id="modal-contenido" class="bg-white dark:bg-[#141519] border-t sm:border border-stone-200 dark:border-stone-800 rounded-t-3xl sm:rounded-3xl w-full max-w-md p-5 pb-7 sm:pb-5 shadow-2xl space-y-4 relative anim-modal">
            
            <!-- Indicador táctil superior -->
            <div class="w-10 h-1 bg-stone-300 dark:bg-stone-700 rounded-full mx-auto mb-1 sm:hidden"></div>

            <!-- Cabecera del Modal -->
            <div class="flex justify-between items-start border-b border-stone-100 dark:border-stone-800 pb-3.5">
                <div class="pr-2">
                    <span class="inline-flex items-center gap-1.5 text-[10px] uppercase tracking-widest text-amber-600 dark:text-amber-400 font-extrabold">
                        <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
                        Grupo Bautista • Ficha Técnica
                    </span>
                    <h2 id="modal-titulo" class="text-lg font-extrabold text-stone-900 dark:text-white mt-0.5 leading-snug">Nombre de Máquina</h2>
                </div>
                <button onclick="cerrarModal()" class="bg-stone-100 dark:bg-stone-800 hover:bg-stone-200 dark:hover:bg-stone-700 text-stone-500 dark:text-stone-400 w-9 h-9 rounded-full flex items-center justify-center transition active:scale-90 shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Controles de Navegación por Fecha -->
            <div class="flex items-center justify-between bg-stone-100/90 dark:bg-stone-900 p-1.5 rounded-2xl border border-stone-200/80 dark:border-stone-800">
                <button id="btn-fecha-ant" class="w-10 h-10 flex items-center justify-center text-amber-600 dark:text-amber-400 bg-white dark:bg-stone-800 shadow-xs hover:bg-amber-50 dark:hover:bg-stone-700 rounded-xl transition active:scale-90 disabled:opacity-30 disabled:shadow-none disabled:hover:bg-white dark:disabled:hover:bg-stone-800">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <div class="text-center flex-1">
                    <span class="block text-[9px] font-bold text-stone-400 uppercase tracking-widest">Fecha del Registro</span>
                    <span id="modal-fecha-actual" class="font-extrabold text-stone-900 dark:text-white text-sm">--/--/--</span>
                </div>
                <button id="btn-fecha-sig" class="w-10 h-10 flex items-center justify-center text-amber-600 dark:text-amber-400 bg-white dark:bg-stone-800 shadow-xs hover:bg-amber-50 dark:hover:bg-stone-700 rounded-xl transition active:scale-90 disabled:opacity-30 disabled:shadow-none disabled:hover:bg-white dark:disabled:hover:bg-stone-800">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>

            <!-- Datos Ordenados -->
            <div id="modal-datos-cuerpo" class="space-y-2.5 text-xs md:text-sm transition-opacity duration-150">
                
                <!-- Ubicación y Operador -->
                <div class="bg-stone-50 dark:bg-stone-900/80 p-3.5 rounded-2xl border border-stone-200/70 dark:border-stone-800 space-y-2.5">
                    <div class="flex justify-between items-start gap-3">
                        <span class="text-stone-400 text-xs font-medium flex items-center gap-1.5 shrink-0">
                            <svg class="w-3.5 h-3.5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            Ubicación
                        </span>
                        <span id="modal-lugar" class="font-bold text-stone-800 dark:text-stone-100 text-right break-words text-xs">--</span>
                    </div>
                    <div class="border-t border-stone-200/70 dark:border-stone-800 pt-2.5 flex justify-between items-center gap-3">
                        <span class="text-stone-400 text-xs font-medium flex items-center gap-1.5 shrink-0">
                            <svg class="w-3.5 h-3.5 text-stone-500 dark:text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            Operador
                        </span>
                        <span id="modal-operador" class="font-bold text-stone-800 dark:text-stone-100 text-right truncate text-xs">--</span>
                    </div>
                </div>

                <!-- Horómetros -->
                <div class="grid grid-cols-2 gap-2.5">
                    <div class="bg-stone-50 dark:bg-stone-900/80 p-3.5 rounded-2xl border border-stone-200/70 dark:border-stone-800">
                        <span class="text-stone-400 text-[11px] font-medium block mb-1">Horómetro Inicial</span>
                        <span id="modal-hinicial" class="font-extrabold text-stone-900 dark:text-white text-base tracking-tight">--</span>
                    </div>
                    <div class="bg-stone-50 dark:bg-stone-900/80 p-3.5 rounded-2xl border border-stone-200/70 dark:border-stone-800">
                        <span class="text-stone-400 text-[11px] font-medium block mb-1">Horómetro Final</span>
                        <span id="modal-hfinal" class="font-extrabold text-stone-900 dark:text-white text-base tracking-tight">--</span>
                    </div>
                </div>

                <!-- Horas Totales y Combustible -->
                <div class="grid grid-cols-2 gap-2.5">
                    <div class="bg-stone-100/90 dark:bg-stone-800/70 p-3.5 rounded-2xl border border-stone-200 dark:border-stone-700">
                        <span class="text-stone-500 dark:text-stone-400 text-[11px] font-bold block mb-1">Horas Totales</span>
                        <span id="modal-totales" class="font-black text-stone-900 dark:text-white text-base">--</span>
                    </div>
                    <div class="bg-amber-500/10 dark:bg-amber-500/15 p-3.5 rounded-2xl border border-amber-500/30">
                        <span class="text-amber-700 dark:text-amber-400 text-[11px] font-bold block mb-1">Combustible</span>
                        <span id="modal-combustible" class="font-black text-amber-600 dark:text-amber-300 text-base">--</span>
                    </div>
                </div>

            </div>

            <button onclick="cerrarModal()" class="w-full bg-stone-900 hover:bg-stone-800 dark:bg-amber-500 dark:hover:bg-amber-400 text-amber-400 dark:text-stone-950 font-extrabold py-3.5 rounded-2xl transition-all active:scale-95 text-sm shadow-lg mt-1">
                Cerrar Ficha
            </button>
        </div>
    </div>

    <script>
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vReJl2BT_9uiaFmB-U1-UlhHKE9lSmhK8jB2bF1Pu1MlM0B15O2H5WxM_ot85WtTIol4_bVhuudvcHU/pub?gid=1193959640&single=true&output=csv";

        let todosLosRegistros = [];
        let fechasUnicas = []; 
        let fechaVigenteParseo = "Sin Fecha";
        
        let maquinaActualModal = "";
        let fechaActualModal = "";
        let filtroUbicacionActual = "TODOS";

        // Paleta ejecutiva mejorada para las tarjetas
        const paletaLugares = [
            {
                card: 'bg-gradient-to-br from-white via-white to-amber-50/60 dark:from-[#16171C] dark:via-[#141519] dark:to-amber-950/20 border-amber-300/80 dark:border-amber-500/35 text-stone-900 dark:text-stone-100',
                badge: 'bg-amber-500/15 text-amber-800 border-amber-500/30 dark:bg-amber-500/20 dark:text-amber-300 dark:border-amber-500/30',
                iconBox: 'bg-amber-500/15 border-amber-500/25 text-amber-600 dark:text-amber-400',
                accent: 'bg-gradient-to-b from-amber-400 to-amber-600'
            },
            {
                card: 'bg-gradient-to-br from-white via-white to-stone-100/80 dark:from-[#16171C] dark:via-[#141519] dark:to-stone-800/30 border-stone-300/90 dark:border-stone-700 text-stone-900 dark:text-stone-100',
                badge: 'bg-stone-900 text-amber-400 border-stone-800 dark:bg-stone-800 dark:text-stone-200 dark:border-stone-700',
                iconBox: 'bg-stone-900/5 dark:bg-stone-800 border-stone-300/80 dark:border-stone-700 text-stone-800 dark:text-amber-400',
                accent: 'bg-gradient-to-b from-stone-700 to-stone-950 dark:from-stone-300 dark:to-stone-500'
            },
            {
                card: 'bg-gradient-to-br from-white via-white to-orange-50/60 dark:from-[#16171C] dark:via-[#141519] dark:to-orange-950/20 border-orange-300/80 dark:border-orange-500/35 text-stone-900 dark:text-stone-100',
                badge: 'bg-orange-500/15 text-orange-800 border-orange-500/30 dark:bg-orange-500/20 dark:text-orange-300 dark:border-orange-500/30',
                iconBox: 'bg-orange-500/15 border-orange-500/25 text-orange-600 dark:text-orange-400',
                accent: 'bg-gradient-to-b from-orange-500 to-orange-700'
            },
            {
                card: 'bg-gradient-to-br from-white via-white to-slate-100/70 dark:from-[#16171C] dark:via-[#141519] dark:to-slate-800/25 border-slate-300/90 dark:border-slate-700 text-stone-900 dark:text-stone-100',
                badge: 'bg-slate-100 text-slate-700 border-slate-300 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700',
                iconBox: 'bg-slate-500/10 border-slate-300/80 dark:border-slate-700 text-slate-700 dark:text-slate-300',
                accent: 'bg-gradient-to-b from-slate-500 to-slate-700'
            }
        ];
        
        let mapaColoresLugar = {};
        let contadorLugares = 0;

        function recargarConAnimacion() {
            const icono = document.getElementById('icono-recargar');
            icono.classList.add('rotate-180');
            setTimeout(() => {
                location.reload();
            }, 250);
        }

        Papa.parse(SHEET_CSV_URL, {
            download: true,
            header: false,
            complete: function(results) {
                const rows = results.data;
                if (!rows || rows.length === 0) return;

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('grid-maquinas').classList.remove('hidden');
                
                let fechasEncontradasSet = new Set();

                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length === 0) continue;

                    for (let j = 0; j < Math.min(row.length, 6); j++) {
                        let celda = row[j] ? row[j].trim() : "";
                        if (/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/.test(celda)) {
                            fechaVigenteParseo = celda;
                            fechasEncontradasSet.add(celda);
                            break;
                        }
                    }

                    if (row.length < 8) continue;

                    const lugar = row[0] ? row[0].trim() : 'Sin ubicación'; 
                    const unidad = row[7] ? row[7].trim() : '';             

                    if (!unidad || unidad.toUpperCase() === 'UNIDAD' || unidad.toUpperCase() === 'EQUIPO' || unidad.toUpperCase().includes('REPORTE')) {
                        continue;
                    }

                    todosLosRegistros.push({
                        fechaFiltro: fechaVigenteParseo,
                        lugar: lugar,                                     
                        unidad: unidad,                                   
                        operador: row[6] ? row[6].trim() : 'No asignado', 
                        hInicial: row[8] ? row[8].trim() : '-',           
                        hFinal: row[9] ? row[9].trim() : '-',             
                        totalHoras: row[10] ? row[10].trim() : '0',       
                        combustible: row[12] ? row[12].trim() : '0 Gal'   
                    });
                }

                fechasUnicas = Array.from(fechasEncontradasSet);
                const selector = document.getElementById('selector-fecha');
                selector.innerHTML = '';

                if (fechasUnicas.length > 0) {
                    fechasUnicas.forEach(f => {
                        const opt = document.createElement('option');
                        opt.value = f;
                        opt.innerText = f;
                        selector.appendChild(opt);
                    });
                    selector.value = fechasUnicas[fechasUnicas.length - 1]; 
                } else {
                    selector.innerHTML = '<option value="">No hay fechas</option>';
                }

                actualizarVista();
            },
            error: function(err) {
                document.getElementById('loading').innerHTML = '<span class="text-red-500 font-semibold">Error al leer los datos.</span>';
            }
        });

        function filtrarPorUbicacion(categoria, botonClickado) {
            filtroUbicacionActual = categoria;
            
            const botones = document.querySelectorAll('.btn-filtro');
            botones.forEach(btn => {
                btn.classList.remove('bg-stone-900', 'dark:bg-amber-500', 'text-amber-400', 'dark:text-stone-950', 'border-stone-900', 'dark:border-amber-500', 'font-bold');
                btn.classList.add('bg-white', 'dark:bg-stone-800/80', 'text-stone-600', 'dark:text-stone-300', 'border-stone-200', 'dark:border-stone-700', 'font-semibold', 'hover:bg-stone-100', 'dark:hover:bg-stone-800');
            });

            botonClickado.classList.remove('bg-white', 'dark:bg-stone-800/80', 'text-stone-600', 'dark:text-stone-300', 'border-stone-200', 'dark:border-stone-700', 'font-semibold', 'hover:bg-stone-100', 'dark:hover:bg-stone-800');
            botonClickado.classList.add('bg-stone-900', 'dark:bg-amber-500', 'text-amber-400', 'dark:text-stone-950', 'border-stone-900', 'dark:border-amber-500', 'font-bold');

            actualizarVista();
        }

        function actualizarVista() {
            const fechaSeleccionada = document.getElementById('selector-fecha').value;
            const textoBusqueda = document.getElementById('buscador').value.toLowerCase();

            const filtrados = todosLosRegistros.filter(item => {
                const coincideBasico = (item.fechaFiltro === fechaSeleccionada) && item.unidad.toLowerCase().includes(textoBusqueda);
                if (!coincideBasico) return false;

                const lugarUpper = item.lugar.toUpperCase();
                if (filtroUbicacionActual === "TODOS") {
                    return true;
                } else if (filtroUbicacionActual === "CARRETERA CHIPULUC") {
                    return lugarUpper.includes("CARRETERA CHIPULUC");
                } else if (filtroUbicacionActual === "OLMOS") {
                    return lugarUpper.includes("OLMOS");
                } else if (filtroUbicacionActual === "OTROS") {
                    return !lugarUpper.includes("CARRETERA CHIPULUC") && !lugarUpper.includes("OLMOS");
                }
                return true;
            });

            renderizarBotones(filtrados);
        }

        function renderizarBotones(datos) {
            const grid = document.getElementById('grid-maquinas');
            let html = '';

            if (datos.length === 0) {
                grid.innerHTML = '<div class="col-span-2 text-center text-stone-400 py-16 text-sm bg-white dark:bg-[#141519] rounded-2xl border border-stone-200 dark:border-stone-800 anim-card">No se encontraron máquinas en esta vista.</div>';
                return;
            }

            datos.forEach((item, idx) => {
                const indexReal = todosLosRegistros.indexOf(item);
                
                if (!mapaColoresLugar[item.lugar]) {
                    mapaColoresLugar[item.lugar] = paletaLugares[contadorLugares % paletaLugares.length];
                    contadorLugares++;
                }
                const estilo = mapaColoresLugar[item.lugar];
                const delay = Math.min(idx * 25, 300);

                html += `
                    <button onclick="abrirDetalle(${indexReal})" style="animation-delay: ${delay}ms;" class="anim-card ${estilo.card} p-3.5 rounded-2xl shadow-[0_4px_14px_-4px_rgba(0,0,0,0.07)] border flex flex-col justify-between items-start text-left transition-all duration-200 hover:shadow-md hover:-translate-y-0.5 active:scale-95 min-h-[114px] relative overflow-hidden group">
                        
                        <!-- Barra lateral de acento corporativo -->
                        <div class="absolute left-0 top-3 bottom-3 w-1 rounded-r-full ${estilo.accent}"></div>

                        <!-- Fila superior: Ícono de maquinaria pesada + Píldora de ubicación -->
                        <div class="flex justify-between items-start w-full mb-2.5 pl-1.5 gap-2">
                            <div class="w-8 h-8 rounded-xl border ${estilo.iconBox} flex items-center justify-center shrink-0 transition-transform duration-300 group-hover:scale-110 shadow-2xs">
                                <!-- Ilustración vectorial de Excavadora / Maquinaria Pesada -->
                                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <!-- Brazo articulado y pala -->
                                    <path d="M14 11l3-6 4 3-1.5 3.5"/>
                                    <path d="M18.5 11.5l2.5 1.5-1.5 2.5-2-1z"/>
                                    <!-- Cabina y cuerpo -->
                                    <path d="M5 14v-4a1 1 0 0 1 1-1h5l2 3v2"/>
                                    <path d="M3 14h11v2H3z"/>
                                    <!-- Orugas / Ruedas -->
                                    <rect x="3" y="16" width="11" height="3.5" rx="1.75"/>
                                    <circle cx="5.2" cy="17.75" r="0.6" fill="currentColor"/>
                                    <circle cx="8.5" cy="17.75" r="0.6" fill="currentColor"/>
                                    <circle cx="11.8" cy="17.75" r="0.6" fill="currentColor"/>
                                </svg>
                            </div>
                            <span class="text-[9px] font-extrabold ${estilo.badge} border px-2.5 py-0.5 rounded-full text-center leading-tight max-w-[72%] line-clamp-2">${item.lugar}</span>
                        </div>

                        <!-- Nombre del equipo + Indicador sutil de acción -->
                        <div class="pl-1.5 w-full flex items-end justify-between gap-1.5 pt-1 border-t border-stone-200/50 dark:border-stone-800/70">
                            <span class="font-extrabold text-xs leading-snug text-stone-900 dark:text-white tracking-tight line-clamp-2">${item.unidad}</span>
                            <svg class="w-3.5 h-3.5 text-stone-400 group-hover:text-amber-500 group-hover:translate-x-0.5 transition-all shrink-0 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                        </div>
                    </button>
                `;
            });

            grid.innerHTML = html;
        }

        function abrirDetalle(indexOriginal) {
            const m = todosLosRegistros[indexOriginal];
            maquinaActualModal = m.unidad;
            fechaActualModal = m.fechaFiltro;
            
            cargarDatosEnModal(m);
            actualizarBotonesNavegacionFecha();
            
            const modal = document.getElementById('modal-detalle');
            const contenido = document.getElementById('modal-contenido');
            
            modal.classList.remove('hidden');
            contenido.classList.remove('anim-modal');
            void contenido.offsetWidth; 
            contenido.classList.add('anim-modal');
        }

        function cargarDatosEnModal(m) {
            const cuerpo = document.getElementById('modal-datos-cuerpo');
            cuerpo.style.opacity = '0.4';
            
            setTimeout(() => {
                document.getElementById('modal-titulo').innerText = m.unidad;
                document.getElementById('modal-fecha-actual').innerText = m.fechaFiltro;
                document.getElementById('modal-lugar').innerText = m.lugar;
                document.getElementById('modal-operador').innerText = m.operador || 'Sin registro';
                document.getElementById('modal-hinicial').innerText = m.hInicial;
                document.getElementById('modal-hfinal').innerText = m.hFinal;
                document.getElementById('modal-totales').innerText = m.totalHoras + " hrs";
                document.getElementById('modal-combustible').innerText = m.combustible || '0 Gal';
                cuerpo.style.opacity = '1';
            }, 90);
        }

        function actualizarBotonesNavegacionFecha() {
            const idxFechaActual = fechasUnicas.indexOf(fechaActualModal);
            const btnAnt = document.getElementById('btn-fecha-ant');
            const btnSig = document.getElementById('btn-fecha-sig');

            let indiceAnterior = -1;
            for (let i = idxFechaActual - 1; i >= 0; i--) {
                if (verificarSiMaquinaExisteEnFecha(maquinaActualModal, fechasUnicas[i])) {
                    indiceAnterior = i;
                    break;
                }
            }

            let indiceSiguiente = -1;
            for (let i = idxFechaActual + 1; i < fechasUnicas.length; i++) {
                if (verificarSiMaquinaExisteEnFecha(maquinaActualModal, fechasUnicas[i])) {
                    indiceSiguiente = i;
                    break;
                }
            }

            if (indiceAnterior !== -1) {
                btnAnt.disabled = false;
                btnAnt.onclick = () => saltarAFecha(fechasUnicas[indiceAnterior]);
            } else {
                btnAnt.disabled = true;
                btnAnt.onclick = null;
            }

            if (indiceSiguiente !== -1) {
                btnSig.disabled = false;
                btnSig.onclick = () => saltarAFecha(fechasUnicas[indiceSiguiente]);
            } else {
                btnSig.disabled = true;
                btnSig.onclick = null;
            }
        }

        function verificarSiMaquinaExisteEnFecha(nombreMaquina, fechaFiltro) {
            return todosLosRegistros.some(r => r.unidad === nombreMaquina && r.fechaFiltro === fechaFiltro);
        }

        function saltarAFecha(nuevaFecha) {
            const registroEncontrado = todosLosRegistros.find(r => r.unidad === maquinaActualModal && r.fechaFiltro === nuevaFecha);
            if (registroEncontrado) {
                fechaActualModal = nuevaFecha;
                cargarDatosEnModal(registroEncontrado);
                actualizarBotonesNavegacionFecha();
            }
        }

        function cerrarModal() {
            document.getElementById('modal-detalle').classList.add('hidden');
        }

        document.getElementById('modal-detalle').addEventListener('click', function(e) {
            if (e.target === this) {
                cerrarModal();
            }
        });

        document.getElementById('selector-fecha').addEventListener('change', actualizarVista);
        document.getElementById('buscador').addEventListener('input', actualizarVista);
    </script>
</body>
</html>
