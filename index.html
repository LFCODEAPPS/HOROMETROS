<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control De Maquinaria Grupo Bautista</title>
    
    <!-- ÍCONOS PARA ACCESO DIRECTO EN iOS Y ANDROID -->
    <link rel="icon" type="image/png" href="bautista.png">
    <link rel="apple-touch-icon" href="bautista.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Grupo Bautista">

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script><style>
:root{color-scheme:light;--paper:#f5f3ec;--panel:#fffefa;--ink:#162e37;--muted:#51666d;--line:#c9d1cd;--soft:#e8ece6;--gold:#ffca50}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px 'Helvetica Neue',Arial,sans-serif}button,input,select{font:inherit;color:inherit}button,select{cursor:pointer}button{border:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c58b17;outline-offset:2px}.hidden{display:none!important}.wrap{width:min(1152px,calc(100% - 48px));margin:auto}
header{background:#142e38;color:white;border-bottom:5px solid var(--gold);position:relative;overflow:hidden}header:after{content:'';position:absolute;inset:0 0 0 55%;background:repeating-linear-gradient(122deg,transparent 0 26px,#ffffff13 27px 28px,transparent 29px 58px);pointer-events:none}header .wrap{position:relative;z-index:1;padding:28px 0 36px}.brand{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.18em}.brandmark{display:grid;place-items:center;width:40px;height:40px;background:var(--gold);color:#152c35;font:bold 18px monospace;letter-spacing:-.12em;position:relative;border-radius:4px}.brandmark img{position:absolute;width:100%;height:100%;object-fit:contain;background:white;border-radius:4px}h1{font-size:clamp(32px,5vw,64px);letter-spacing:-.055em;line-height:1;margin:22px 0 0}
.tools{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line)}.bar{padding:18px 0 0}.inputs{display:grid;grid-template-columns:200px 1fr auto;gap:12px;align-items:end}label{display:grid;gap:6px;font-size:11px;letter-spacing:.08em;font-weight:700;text-transform:uppercase;color:var(--muted)}input,select,.reload{height:43px;border-radius:5px;border:1px solid var(--line);padding:0 12px;background:var(--panel);color:var(--ink);width:100%;font-size:15px}.reload,.primary{background:var(--gold);border:0;color:#172d34;font-weight:700}.reload{display:flex;align-items:center;gap:8px}#icono-recargar{display:inline-block;transition:transform .25s}.rotate-180{transform:rotate(180deg)}nav{display:flex;gap:20px;overflow:auto}nav button{white-space:nowrap;padding:15px 0 12px;background:transparent;color:var(--muted);font-size:13px;border-bottom:3px solid transparent}.btn-filtro.bg-emerald-500{border-color:#c88908;color:var(--ink);font-weight:bold}
main{padding:32px 0 68px}h2{font-size:26px;letter-spacing:-.045em;margin:0 0 17px}#grid-maquinas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(225px,100%),1fr));gap:12px}.unit{--stripe:#448771;text-align:left;position:relative;display:flex;flex-direction:column;gap:20px;align-items:flex-start;padding:18px 34px 18px 17px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--stripe);border-radius:6px;min-width:0}.unit[class*="bg-blue"]{--stripe:#5184a2}.unit[class*="bg-amber"]{--stripe:#ad7d2c}.unit[class*="bg-purple"]{--stripe:#866696}.unit:hover{border-color:var(--stripe);box-shadow:0 3px 10px #112b3312}.place{font:700 10px/1.4 monospace;letter-spacing:.055em;text-transform:uppercase;color:var(--muted)}.unit strong{font-size:20px;letter-spacing:-.035em;overflow-wrap:anywhere}.arrow{position:absolute;right:12px;top:15px;color:var(--muted)}#loading,#grid-maquinas>div{grid-column:1/-1;padding:38px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}
#modal-detalle{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:14px;background:#071a22ad;backdrop-filter:blur(4px)}#modal-contenido{width:min(420px,100%);max-height:92dvh;overflow:auto;border-radius:12px;background:var(--panel);box-shadow:0 24px 80px #0004}.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;background:#142e38;color:white;padding:23px;gap:12px}.sheet-head small{color:var(--gold);letter-spacing:.12em;text-transform:uppercase}.sheet-head h2{margin:6px 0 0;overflow-wrap:anywhere}.sheet-head button,.dates button{width:40px;height:40px;border-radius:5px;background:var(--soft);color:var(--ink);flex:none}.dates{margin:18px;display:flex;justify-content:space-between;text-align:center;align-items:center}.dates small,.field span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.dates button:disabled{opacity:.35}.facts{margin:0 18px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr}.field{padding:14px 6px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.field strong,.dates b{font-variant-numeric:tabular-nums}.primary{margin:16px 18px;width:calc(100% - 36px);padding:13px;border-radius:5px}
@media(max-width:640px){.wrap{width:calc(100% - 32px)}header .wrap{padding:16px 0 22px}h1{margin-top:14px}.bar{padding-top:11px}.inputs{grid-template-columns:1fr auto;gap:8px}.search{grid-column:1/-1;grid-row:2}.search span{display:none}nav{gap:16px}main{padding-top:20px}#grid-maquinas{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.unit{padding:12px 19px 14px 10px;gap:14px}.unit strong{font-size:16px}.arrow{top:10px;right:5px}}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--paper:#12232a;--panel:#1b3038;--ink:#f0f3ed;--muted:#bccbc9;--line:#41555a;--soft:#334950}}
@media(prefers-reduced-motion:no-preference){.anim-card,.anim-modal{animation:appear .22s backwards}@keyframes appear{from{opacity:0;transform:translateY(5px)}}}
</style></head><body><header><div class="wrap"><div class="brand"><span class="brandmark">GB<img src="bautista.png" alt="" onerror="this.hidden=true"></span>Grupo Bautista</div><h1>Control de maquinaria</h1></div></header>
<section class="tools"><div class="wrap bar"><div class="inputs"><label>Fecha de registro<select id="selector-fecha"><option value="">Cargando fechas…</option></select></label><label class="search"><span>Buscar equipo</span><input id="buscador" aria-label="Buscar equipo o maquinaria" placeholder="Buscar equipo o maquinaria…"></label><button class="reload" id="btn-recargar" onclick="recargarConAnimacion()"><span id="icono-recargar" aria-hidden="true">↻</span>Actualizar</button></div><nav id="botones-categoria" aria-label="Filtrar por ubicación"><button class="btn-filtro bg-emerald-500" onclick="filtrarPorUbicacion('TODOS',this)">Todos</button><button class="btn-filtro " onclick="filtrarPorUbicacion('CARRETERA CHIPULUC',this)">Carretera chipuluc</button><button class="btn-filtro " onclick="filtrarPorUbicacion('OLMOS',this)">Olmos</button><button class="btn-filtro " onclick="filtrarPorUbicacion('OTROS',this)">Otros</button></nav></div></section>
<main class="wrap"><h2>Equipos por ubicación</h2><div id="loading">Cargando registros de maquinaria…</div><div id="grid-maquinas" class="hidden"></div></main>
<div id="modal-detalle" class="hidden"><section id="modal-contenido" role="dialog" aria-modal="true" aria-labelledby="modal-titulo"><header class="sheet-head"><div><small>Detalle de unidad</small><h2 id="modal-titulo">Equipo</h2></div><button onclick="cerrarModal()" aria-label="Cerrar">×</button></header><div class="dates"><button id="btn-fecha-ant" aria-label="Registro anterior">‹</button><div><small>Fecha del registro</small><b id="modal-fecha-actual"></b></div><button id="btn-fecha-sig" aria-label="Registro siguiente">›</button></div><div class="facts" id="modal-datos-cuerpo"><div class="field"><span>Lugar</span><strong id="modal-lugar">—</strong></div><div class="field"><span>Operador</span><strong id="modal-operador">—</strong></div><div class="field"><span>H. inicial</span><strong id="modal-hinicial">—</strong></div><div class="field"><span>H. final</span><strong id="modal-hfinal">—</strong></div><div class="field"><span>Horas totales</span><strong id="modal-totales">—</strong></div><div class="field"><span>Combustible</span><strong id="modal-combustible">—</strong></div></div><button class="primary" onclick="cerrarModal()">Cerrar detalle</button></section></div>    <script>
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vReJl2BT_9uiaFmB-U1-UlhHKE9lSmhK8jB2bF1Pu1MlM0B15O2H5WxM_ot85WtTIol4_bVhuudvcHU/pub?gid=1193959640&single=true&output=csv";

        let todosLosRegistros = [];
        let fechasUnicas = []; 
        let fechaVigenteParseo = "Sin Fecha";
        
        let maquinaActualModal = "";
        let fechaActualModal = "";
        let filtroUbicacionActual = "TODOS";

        const paletaLugares = [
            'bg-emerald-50/90 border-emerald-200/90 text-emerald-950 dark:bg-emerald-950/40 dark:border-emerald-800/70 dark:text-emerald-100',
            'bg-blue-50/90 border-blue-200/90 text-blue-950 dark:bg-blue-950/40 dark:border-blue-800/70 dark:text-blue-100',
            'bg-amber-50/90 border-amber-200/90 text-amber-950 dark:bg-amber-950/40 dark:border-amber-800/70 dark:text-amber-100',
            'bg-purple-50/90 border-purple-200/90 text-purple-950 dark:bg-purple-950/40 dark:border-purple-800/70 dark:text-purple-100'
        ];
        
        let mapaColoresLugar = {};
        let contadorLugares = 0;

        function recargarConAnimacion() {
            const icono = document.getElementById('icono-recargar');
            icono.classList.add('rotate-180');
            setTimeout(() => {
                location.reload();
            }, 250);
        }

        Papa.parse(SHEET_CSV_URL, {
            download: true,
            header: false,
            complete: function(results) {
                const rows = results.data;
                if (!rows || rows.length === 0) return;

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('grid-maquinas').classList.remove('hidden');
                
                let fechasEncontradasSet = new Set();

                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length === 0) continue;

                    for (let j = 0; j < Math.min(row.length, 6); j++) {
                        let celda = row[j] ? row[j].trim() : "";
                        if (/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/.test(celda)) {
                            fechaVigenteParseo = celda;
                            fechasEncontradasSet.add(celda);
                            break;
                        }
                    }

                    if (row.length < 8) continue;

                    const lugar = row[0] ? row[0].trim() : 'Sin ubicación'; 
                    const unidad = row[7] ? row[7].trim() : '';             

                    if (!unidad || unidad.toUpperCase() === 'UNIDAD' || unidad.toUpperCase() === 'EQUIPO' || unidad.toUpperCase().includes('REPORTE')) {
                        continue;
                    }

                    todosLosRegistros.push({
                        fechaFiltro: fechaVigenteParseo,
                        lugar: lugar,                                     
                        unidad: unidad,                                   
                        operador: row[6] ? row[6].trim() : 'No asignado', 
                        hInicial: row[8] ? row[8].trim() : '-',           
                        hFinal: row[9] ? row[9].trim() : '-',             
                        totalHoras: row[10] ? row[10].trim() : '0',       
                        combustible: row[12] ? row[12].trim() : '0 Gal'   
                    });
                }

                fechasUnicas = Array.from(fechasEncontradasSet);
                const selector = document.getElementById('selector-fecha');
                selector.innerHTML = '';

                if (fechasUnicas.length > 0) {
                    fechasUnicas.forEach(f => {
                        const opt = document.createElement('option');
                        opt.value = f;
                        opt.innerText = f;
                        selector.appendChild(opt);
                    });
                    selector.value = fechasUnicas[fechasUnicas.length - 1]; 
                } else {
                    selector.innerHTML = '<option value="">No hay fechas</option>';
                }

                actualizarVista();
            },
            error: function(err) {
                document.getElementById('loading').innerHTML = '<span class="text-red-500">Error al leer los datos.</span>';
            }
        });

        function filtrarPorUbicacion(categoria, botonClickado) {
            filtroUbicacionActual = categoria;
            
            const botones = document.querySelectorAll('.btn-filtro');
            botones.forEach(btn => {
                btn.classList.remove('bg-emerald-500', 'text-white', 'dark:text-slate-950', 'border-emerald-500', 'font-bold');
                btn.classList.add('bg-slate-100/80', 'dark:bg-slate-800/80', 'text-slate-600', 'dark:text-slate-300', 'border-slate-200', 'dark:border-slate-700', 'font-semibold', 'hover:bg-slate-200/70', 'dark:hover:bg-slate-700');
            });

            botonClickado.classList.remove('bg-slate-100/80', 'dark:bg-slate-800/80', 'text-slate-600', 'dark:text-slate-300', 'border-slate-200', 'dark:border-slate-700', 'font-semibold', 'hover:bg-slate-200/70', 'dark:hover:bg-slate-700');
            botonClickado.classList.add('bg-emerald-500', 'text-white', 'dark:text-slate-950', 'border-emerald-500', 'font-bold');

            actualizarVista();
        }

        function actualizarVista() {
            const fechaSeleccionada = document.getElementById('selector-fecha').value;
            const textoBusqueda = document.getElementById('buscador').value.toLowerCase();

            const filtrados = todosLosRegistros.filter(item => {
                const coincideBasico = (item.fechaFiltro === fechaSeleccionada) && item.unidad.toLowerCase().includes(textoBusqueda);
                if (!coincideBasico) return false;

                const lugarUpper = item.lugar.toUpperCase();
                if (filtroUbicacionActual === "TODOS") {
                    return true;
                } else if (filtroUbicacionActual === "CARRETERA CHIPULUC") {
                    return lugarUpper.includes("CARRETERA CHIPULUC");
                } else if (filtroUbicacionActual === "OLMOS") {
                    return lugarUpper.includes("OLMOS");
                } else if (filtroUbicacionActual === "OTROS") {
                    return !lugarUpper.includes("CARRETERA CHIPULUC") && !lugarUpper.includes("OLMOS");
                }
                return true;
            });

            renderizarBotones(filtrados);
        }

        function renderizarBotones(datos) {
            const grid = document.getElementById('grid-maquinas');
            let html = '';

            if (datos.length === 0) {
                grid.innerHTML = '<div class="col-span-2 text-center text-slate-500 dark:text-slate-400 py-16 text-sm bg-white dark:bg-slate-800/30 rounded-2xl border border-slate-200 dark:border-slate-800 anim-card">No se encontraron máquinas en esta vista.</div>';
                return;
            }

            datos.forEach((item, idx) => {
                const indexReal = todosLosRegistros.indexOf(item);
                
                if (!mapaColoresLugar[item.lugar]) {
                    mapaColoresLugar[item.lugar] = paletaLugares[contadorLugares % paletaLugares.length];
                    contadorLugares++;
                }
                const colorClase = mapaColoresLugar[item.lugar];
                // Retraso escalonado suave para el efecto cascada al cambiar de pantalla/filtro
                const delay = Math.min(idx * 25, 300);

                html += `
                    <button onclick="abrirDetalle(${indexReal})" style="animation-delay: ${delay}ms" class="unit anim-card ${colorClase}">
                        <span class="place">${item.lugar}</span>
                        <strong>${item.unidad}</strong><span class="arrow" aria-hidden="true">↗</span>
                    </button>
                `;
            });

            grid.innerHTML = html;
        }

        function abrirDetalle(indexOriginal) {
            const m = todosLosRegistros[indexOriginal];
            maquinaActualModal = m.unidad;
            fechaActualModal = m.fechaFiltro;
            
            cargarDatosEnModal(m);
            actualizarBotonesNavegacionFecha();
            
            const modal = document.getElementById('modal-detalle');
            const contenido = document.getElementById('modal-contenido');
            
            modal.classList.remove('hidden');
            // Reiniciar animación del modal al abrir
            contenido.classList.remove('anim-modal');
            void contenido.offsetWidth; 
            contenido.classList.add('anim-modal');
        }

        function cargarDatosEnModal(m) {
            const cuerpo = document.getElementById('modal-datos-cuerpo');
            cuerpo.style.opacity = '0.4';
            
            setTimeout(() => {
                document.getElementById('modal-titulo').innerText = m.unidad;
                document.getElementById('modal-fecha-actual').innerText = m.fechaFiltro;
                document.getElementById('modal-lugar').innerText = m.lugar;
                document.getElementById('modal-operador').innerText = m.operador || 'Sin registro';
                document.getElementById('modal-hinicial').innerText = m.hInicial;
                document.getElementById('modal-hfinal').innerText = m.hFinal;
                document.getElementById('modal-totales').innerText = m.totalHoras + " hrs";
                document.getElementById('modal-combustible').innerText = m.combustible || '0 Gal';
                cuerpo.style.opacity = '1';
            }, 90);
        }

        function actualizarBotonesNavegacionFecha() {
            const idxFechaActual = fechasUnicas.indexOf(fechaActualModal);
            const btnAnt = document.getElementById('btn-fecha-ant');
            const btnSig = document.getElementById('btn-fecha-sig');

            let indiceAnterior = -1;
            for (let i = idxFechaActual - 1; i >= 0; i--) {
                if (verificarSiMaquinaExisteEnFecha(maquinaActualModal, fechasUnicas[i])) {
                    indiceAnterior = i;
                    break;
                }
            }

            let indiceSiguiente = -1;
            for (let i = idxFechaActual + 1; i < fechasUnicas.length; i++) {
                if (verificarSiMaquinaExisteEnFecha(maquinaActualModal, fechasUnicas[i])) {
                    indiceSiguiente = i;
                    break;
                }
            }

            if (indiceAnterior !== -1) {
                btnAnt.disabled = false;
                btnAnt.onclick = () => saltarAFecha(fechasUnicas[indiceAnterior]);
            } else {
                btnAnt.disabled = true;
                btnAnt.onclick = null;
            }

            if (indiceSiguiente !== -1) {
                btnSig.disabled = false;
                btnSig.onclick = () => saltarAFecha(fechasUnicas[indiceSiguiente]);
            } else {
                btnSig.disabled = true;
                btnSig.onclick = null;
            }
        }

        function verificarSiMaquinaExisteEnFecha(nombreMaquina, fechaFiltro) {
            return todosLosRegistros.some(r => r.unidad === nombreMaquina && r.fechaFiltro === fechaFiltro);
        }

        function saltarAFecha(nuevaFecha) {
            const registroEncontrado = todosLosRegistros.find(r => r.unidad === maquinaActualModal && r.fechaFiltro === nuevaFecha);
            if (registroEncontrado) {
                fechaActualModal = nuevaFecha;
                cargarDatosEnModal(registroEncontrado);
                actualizarBotonesNavegacionFecha();
            }
        }

        function cerrarModal() {
            document.getElementById('modal-detalle').classList.add('hidden');
        }

        // Cerrar modal al tocar fuera de la tarjeta
        document.getElementById('modal-detalle').addEventListener('click', function(e) {
            if (e.target === this) {
                cerrarModal();
            }
        });

        document.getElementById('selector-fecha').addEventListener('change', actualizarVista);
        document.getElementById('buscador').addEventListener('input', actualizarVista);
    </script></body></html>
