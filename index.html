<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control De Maquinaria Grupo Bautista</title>
    
    <!-- ÍCONOS PARA ACCESO DIRECTO EN iOS Y ANDROID -->
    <link rel="icon" type="image/png" href="bautista.png">
    <link rel="apple-touch-icon" href="bautista.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Grupo Bautista">

    <!-- Fuente moderna Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { 
            touch-action: manipulation; 
            -webkit-tap-highlight-color: transparent;
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(14px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes sheetUp {
            from {
                opacity: 0;
                transform: translateY(100%);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (min-width: 640px) {
            @keyframes sheetUp {
                from {
                    opacity: 0;
                    transform: scale(0.94) translateY(12px);
                }
                to {
                    opacity: 1;
                    transform: scale(1) translateY(0);
                }
            }
        }

        .anim-card {
            animation: fadeSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .anim-modal {
            animation: sheetUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-[#F4F6F9] dark:bg-[#0B0F17] text-slate-900 dark:text-slate-100 min-h-screen pb-16 font-sans transition-colors duration-300 antialiased">

    <!-- BLOQUE SUPERIOR FIJO PREMIUM -->
    <div class="sticky top-0 z-30 bg-white/85 dark:bg-[#0F1522]/85 backdrop-blur-xl border-b border-slate-200/70 dark:border-slate-800/80 shadow-[0_4px_20px_-10px_rgba(0,0,0,0.08)]">
        
        <header class="max-w-xl mx-auto px-4 pt-4 pb-3 space-y-3.5">
            <!-- Fila 1: Marca + Estado en vivo -->
            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="h-10 w-10 rounded-2xl bg-gradient-to-br from-emerald-500/15 to-teal-500/15 dark:from-emerald-500/20 dark:to-teal-500/10 border border-emerald-500/20 p-1.5 flex items-center justify-center shrink-0">
                        <img src="bautista.png" alt="Logo" class="h-full w-full object-contain mix-blend-multiply dark:mix-blend-normal dark:brightness-110" onerror="this.parentElement.style.display='none'">
                    </div>
                    <div class="min-w-0">
                        <div class="flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span class="text-[10px] font-bold uppercase tracking-widest text-emerald-600 dark:text-emerald-400">Grupo Bautista</span>
                        </div>
                        <h1 class="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white tracking-tight truncate">
                            Control De Maquinaria
                        </h1>
                    </div>
                </div>

                <!-- Botón Recarga Minimalista -->
                <button id="btn-recargar" onclick="recargarConAnimacion()" class="h-10 px-3.5 text-slate-600 hover:text-emerald-600 dark:text-slate-300 dark:hover:text-emerald-400 bg-slate-100/90 hover:bg-slate-200/70 dark:bg-slate-800/90 dark:hover:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 flex items-center gap-1.5 text-xs font-bold transition active:scale-95 shrink-0" title="Actualizar datos">
                    <svg id="icono-recargar" class="w-4 h-4 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span class="hidden sm:inline">Actualizar</span>
                </button>
            </div>

            <!-- Fila 2: Selector de Fecha Estilo Cápsula -->
            <div class="relative">
                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-emerald-600 dark:text-emerald-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                <select id="selector-fecha" class="w-full bg-emerald-500/10 hover:bg-emerald-500/15 dark:bg-emerald-500/15 dark:hover:bg-emerald-500/20 text-emerald-950 dark:text-emerald-300 font-extrabold text-xs pl-10 pr-9 py-2.5 rounded-2xl border border-emerald-500/25 focus:ring-2 focus:ring-emerald-500/40 cursor-pointer outline-none appearance-none transition">
                    <option value="">Cargando fechas...</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3.5 text-emerald-700 dark:text-emerald-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                </div>
            </div>
        </header>

        <!-- Filtros por ubicación + Buscador -->
        <div class="max-w-xl mx-auto px-4 pb-3.5 space-y-2.5">
            <div class="flex overflow-x-auto gap-1.5 hide-scrollbar py-0.5" id="botones-categoria">
                <button onclick="filtrarPorUbicacion('TODOS', this)" class="btn-filtro bg-slate-900 dark:bg-emerald-500 text-white dark:text-slate-950 border-slate-900 dark:border-emerald-500 font-bold px-4 py-1.5 rounded-full text-[11px] shrink-0 transition-all duration-200 active:scale-95 shadow-sm border">TODOS</button>
                <button onclick="filtrarPorUbicacion('CARRETERA CHIPULUC', this)" class="btn-filtro bg-white dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 border-slate-200/90 dark:border-slate-700/80 font-semibold px-4 py-1.5 rounded-full text-[11px] shrink-0 transition-all duration-200 active:scale-95 hover:bg-slate-100 dark:hover:bg-slate-800 border">CARRETERA CHIPULUC</button>
                <button onclick="filtrarPorUbicacion('OLMOS', this)" class="btn-filtro bg-white dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 border-slate-200/90 dark:border-slate-700/80 font-semibold px-4 py-1.5 rounded-full text-[11px] shrink-0 transition-all duration-200 active:scale-95 hover:bg-slate-100 dark:hover:bg-slate-800 border">OLMOS</button>
                <button onclick="filtrarPorUbicacion('OTROS', this)" class="btn-filtro bg-white dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 border-slate-200/90 dark:border-slate-700/80 font-semibold px-4 py-1.5 rounded-full text-[11px] shrink-0 transition-all duration-200 active:scale-95 hover:bg-slate-100 dark:hover:bg-slate-800 border">OTROS</button>
            </div>

            <div class="relative">
                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <input type="text" id="buscador" placeholder="Buscar equipo o maquinaria..." 
                    class="w-full bg-slate-100/80 dark:bg-slate-900/90 border border-slate-200/80 dark:border-slate-800 text-xs sm:text-sm rounded-2xl pl-10 pr-4 py-2.5 text-slate-800 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 focus:bg-white dark:focus:bg-slate-800 transition-all">
            </div>
        </div>

    </div>

    <!-- CONTENIDO DESPLAZABLE -->
    <main class="max-w-xl mx-auto p-4">

        <!-- Pantalla de Carga con Logo Transparente -->
        <div id="loading" class="flex flex-col items-center justify-center py-24 text-center space-y-5">
            <div class="relative">
                <div class="absolute inset-0 bg-emerald-500/20 rounded-full blur-xl animate-pulse"></div>
                <div class="relative w-20 h-20 flex items-center justify-center animate-bounce">
                    <img src="bautista.png" alt="Cargando Grupo Bautista" class="max-h-full max-w-full object-contain mix-blend-multiply dark:mix-blend-normal" onerror="this.parentElement.style.display='none'">
                </div>
            </div>
            <p class="text-slate-500 dark:text-slate-400 text-sm font-semibold animate-pulse">
                Espere unos segundos mientras carga el sistema...
            </p>
        </div>

        <!-- Cuadrícula de Botones de Máquinas -->
        <div id="grid-maquinas" class="grid grid-cols-2 gap-3 hidden">
            <!-- Los botones se inyectarán aquí -->
        </div>

    </main>

    <!-- Modal / Bottom Sheet de Detalle -->
    <div id="modal-detalle" class="fixed inset-0 bg-slate-950/60 dark:bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden transition-opacity duration-200">
        <div id="modal-contenido" class="bg-white dark:bg-[#131A29] border-t sm:border border-slate-200 dark:border-slate-800 rounded-t-3xl sm:rounded-3xl w-full max-w-md p-5 pb-7 sm:pb-5 shadow-2xl space-y-4 relative anim-modal">
            
            <!-- Indicador táctil superior para móvil -->
            <div class="w-10 h-1 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto mb-1 sm:hidden"></div>

            <!-- Cabecera del Modal -->
            <div class="flex justify-between items-start border-b border-slate-100 dark:border-slate-800 pb-3.5">
                <div class="pr-2">
                    <span class="inline-flex items-center gap-1 text-[10px] uppercase tracking-widest text-emerald-600 dark:text-emerald-400 font-extrabold">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                        Ficha de Unidad
                    </span>
                    <h2 id="modal-titulo" class="text-lg font-extrabold text-slate-900 dark:text-white mt-0.5 leading-snug">Nombre de Máquina</h2>
                </div>
                <button onclick="cerrarModal()" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 w-9 h-9 rounded-full flex items-center justify-center transition active:scale-90 shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Controles de Navegación por Fecha -->
            <div class="flex items-center justify-between bg-slate-100/80 dark:bg-slate-900/90 p-1.5 rounded-2xl border border-slate-200/70 dark:border-slate-800">
                <button id="btn-fecha-ant" class="w-10 h-10 flex items-center justify-center text-emerald-600 dark:text-emerald-400 bg-white dark:bg-slate-800 shadow-xs hover:bg-emerald-50 dark:hover:bg-slate-700 rounded-xl transition active:scale-90 disabled:opacity-30 disabled:shadow-none disabled:hover:bg-white dark:disabled:hover:bg-slate-800">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <div class="text-center flex-1">
                    <span class="block text-[9px] font-bold text-slate-400 uppercase tracking-widest">Fecha del Registro</span>
                    <span id="modal-fecha-actual" class="font-extrabold text-slate-900 dark:text-white text-sm">--/--/--</span>
                </div>
                <button id="btn-fecha-sig" class="w-10 h-10 flex items-center justify-center text-emerald-600 dark:text-emerald-400 bg-white dark:bg-slate-800 shadow-xs hover:bg-emerald-50 dark:hover:bg-slate-700 rounded-xl transition active:scale-90 disabled:opacity-30 disabled:shadow-none disabled:hover:bg-white dark:disabled:hover:bg-slate-800">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>

            <!-- Datos Ordenados (Estilo Bento Cards) -->
            <div id="modal-datos-cuerpo" class="space-y-2.5 text-xs md:text-sm transition-opacity duration-150">
                
                <!-- Ubicación y Operador -->
                <div class="bg-slate-50 dark:bg-slate-900/70 p-3.5 rounded-2xl border border-slate-200/60 dark:border-slate-800 space-y-2.5">
                    <div class="flex justify-between items-start gap-3">
                        <span class="text-slate-400 text-xs font-medium flex items-center gap-1.5 shrink-0">
                            <svg class="w-3.5 h-3.5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            Ubicación
                        </span>
                        <span id="modal-lugar" class="font-bold text-slate-800 dark:text-slate-100 text-right break-words text-xs">--</span>
                    </div>
                    <div class="border-t border-slate-200/60 dark:border-slate-800 pt-2.5 flex justify-between items-center gap-3">
                        <span class="text-slate-400 text-xs font-medium flex items-center gap-1.5 shrink-0">
                            <svg class="w-3.5 h-3.5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            Operador
                        </span>
                        <span id="modal-operador" class="font-bold text-slate-800 dark:text-slate-100 text-right truncate text-xs">--</span>
                    </div>
                </div>

                <!-- Horómetros (2 columnas) -->
                <div class="grid grid-cols-2 gap-2.5">
                    <div class="bg-slate-50 dark:bg-slate-900/70 p-3.5 rounded-2xl border border-slate-200/60 dark:border-slate-800">
                        <span class="text-slate-400 text-[11px] font-medium block mb-1">Horómetro Inicial</span>
                        <span id="modal-hinicial" class="font-extrabold text-slate-900 dark:text-white text-base tracking-tight">--</span>
                    </div>
                    <div class="bg-slate-50 dark:bg-slate-900/70 p-3.5 rounded-2xl border border-slate-200/60 dark:border-slate-800">
                        <span class="text-slate-400 text-[11px] font-medium block mb-1">Horómetro Final</span>
                        <span id="modal-hfinal" class="font-extrabold text-slate-900 dark:text-white text-base tracking-tight">--</span>
                    </div>
                </div>

                <!-- Horas Totales y Combustible (2 columnas destacadas) -->
                <div class="grid grid-cols-2 gap-2.5">
                    <div class="bg-blue-50/80 dark:bg-blue-950/30 p-3.5 rounded-2xl border border-blue-200/70 dark:border-blue-800/40">
                        <span class="text-blue-600/80 dark:text-blue-400 text-[11px] font-bold block mb-1">Horas Totales</span>
                        <span id="modal-totales" class="font-black text-blue-700 dark:text-blue-300 text-base">--</span>
                    </div>
                    <div class="bg-amber-50/90 dark:bg-amber-950/30 p-3.5 rounded-2xl border border-amber-200/80 dark:border-amber-800/40">
                        <span class="text-amber-700/80 dark:text-amber-400 text-[11px] font-bold block mb-1">Combustible</span>
                        <span id="modal-combustible" class="font-black text-amber-600 dark:text-amber-300 text-base">--</span>
                    </div>
                </div>

            </div>

            <button onclick="cerrarModal()" class="w-full bg-slate-900 hover:bg-slate-800 dark:bg-emerald-500 dark:hover:bg-emerald-400 text-white dark:text-slate-950 font-extrabold py-3.5 rounded-2xl transition-all active:scale-95 text-sm shadow-lg shadow-slate-900/10 dark:shadow-emerald-500/20 mt-1">
                Listo
            </button>
        </div>
    </div>

    <script>
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vReJl2BT_9uiaFmB-U1-UlhHKE9lSmhK8jB2bF1Pu1MlM0B15O2H5WxM_ot85WtTIol4_bVhuudvcHU/pub?gid=1193959640&single=true&output=csv";

        let todosLosRegistros = [];
        let fechasUnicas = []; 
        let fechaVigenteParseo = "Sin Fecha";
        
        let maquinaActualModal = "";
        let fechaActualModal = "";
        let filtroUbicacionActual = "TODOS";

        // Paleta refinada por ubicación con indicador de color lateral y contraste nítido
        const paletaLugares = [
            {
                card: 'bg-white dark:bg-[#131A29] border-emerald-200/90 dark:border-emerald-800/50 text-slate-900 dark:text-slate-100',
                badge: 'bg-emerald-50 text-emerald-700 border-emerald-200/80 dark:bg-emerald-500/15 dark:text-emerald-300 dark:border-emerald-500/30',
                accent: 'bg-emerald-500'
            },
            {
                card: 'bg-white dark:bg-[#131A29] border-blue-200/90 dark:border-blue-800/50 text-slate-900 dark:text-slate-100',
                badge: 'bg-blue-50 text-blue-700 border-blue-200/80 dark:bg-blue-500/15 dark:text-blue-300 dark:border-blue-500/30',
                accent: 'bg-blue-500'
            },
            {
                card: 'bg-white dark:bg-[#131A29] border-amber-200/90 dark:border-amber-800/50 text-slate-900 dark:text-slate-100',
                badge: 'bg-amber-50 text-amber-700 border-amber-200/80 dark:bg-amber-500/15 dark:text-amber-300 dark:border-amber-500/30',
                accent: 'bg-amber-500'
            },
            {
                card: 'bg-white dark:bg-[#131A29] border-purple-200/90 dark:border-purple-800/50 text-slate-900 dark:text-slate-100',
                badge: 'bg-purple-50 text-purple-700 border-purple-200/80 dark:bg-purple-500/15 dark:text-purple-300 dark:border-purple-500/30',
                accent: 'bg-purple-500'
            }
        ];
        
        let mapaColoresLugar = {};
        let contadorLugares = 0;

        function recargarConAnimacion() {
            const icono = document.getElementById('icono-recargar');
            icono.classList.add('rotate-180');
            setTimeout(() => {
                location.reload();
            }, 250);
        }

        Papa.parse(SHEET_CSV_URL, {
            download: true,
            header: false,
            complete: function(results) {
                const rows = results.data;
                if (!rows || rows.length === 0) return;

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('grid-maquinas').classList.remove('hidden');
                
                let fechasEncontradasSet = new Set();

                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length === 0) continue;

                    for (let j = 0; j < Math.min(row.length, 6); j++) {
                        let celda = row[j] ? row[j].trim() : "";
                        if (/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/.test(celda)) {
                            fechaVigenteParseo = celda;
                            fechasEncontradasSet.add(celda);
                            break;
                        }
                    }

                    if (row.length < 8) continue;

                    const lugar = row[0] ? row[0].trim() : 'Sin ubicación'; 
                    const unidad = row[7] ? row[7].trim() : '';             

                    if (!unidad || unidad.toUpperCase() === 'UNIDAD' || unidad.toUpperCase() === 'EQUIPO' || unidad.toUpperCase().includes('REPORTE')) {
                        continue;
                    }

                    todosLosRegistros.push({
                        fechaFiltro: fechaVigenteParseo,
                        lugar: lugar,                                     
                        unidad: unidad,                                   
                        operador: row[6] ? row[6].trim() : 'No asignado', 
                        hInicial: row[8] ? row[8].trim() : '-',           
                        hFinal: row[9] ? row[9].trim() : '-',             
                        totalHoras: row[10] ? row[10].trim() : '0',       
                        combustible: row[12] ? row[12].trim() : '0 Gal'   
                    });
                }

                fechasUnicas = Array.from(fechasEncontradasSet);
                const selector = document.getElementById('selector-fecha');
                selector.innerHTML = '';

                if (fechasUnicas.length > 0) {
                    fechasUnicas.forEach(f => {
                        const opt = document.createElement('option');
                        opt.value = f;
                        opt.innerText = f;
                        selector.appendChild(opt);
                    });
                    selector.value = fechasUnicas[fechasUnicas.length - 1]; 
                } else {
                    selector.innerHTML = '<option value="">No hay fechas</option>';
                }

                actualizarVista();
            },
            error: function(err) {
                document.getElementById('loading').innerHTML = '<span class="text-red-500 font-semibold">Error al leer los datos.</span>';
            }
        });

        function filtrarPorUbicacion(categoria, botonClickado) {
            filtroUbicacionActual = categoria;
            
            const botones = document.querySelectorAll('.btn-filtro');
            botones.forEach(btn => {
                btn.classList.remove('bg-slate-900', 'dark:bg-emerald-500', 'text-white', 'dark:text-slate-950', 'border-slate-900', 'dark:border-emerald-500', 'font-bold');
                btn.classList.add('bg-white', 'dark:bg-slate-800/80', 'text-slate-600', 'dark:text-slate-300', 'border-slate-200/90', 'dark:border-slate-700/80', 'font-semibold', 'hover:bg-slate-100', 'dark:hover:bg-slate-800');
            });

            botonClickado.classList.remove('bg-white', 'dark:bg-slate-800/80', 'text-slate-600', 'dark:text-slate-300', 'border-slate-200/90', 'dark:border-slate-700/80', 'font-semibold', 'hover:bg-slate-100', 'dark:hover:bg-slate-800');
            botonClickado.classList.add('bg-slate-900', 'dark:bg-emerald-500', 'text-white', 'dark:text-slate-950', 'border-slate-900', 'dark:border-emerald-500', 'font-bold');

            actualizarVista();
        }

        function actualizarVista() {
            const fechaSeleccionada = document.getElementById('selector-fecha').value;
            const textoBusqueda = document.getElementById('buscador').value.toLowerCase();

            const filtrados = todosLosRegistros.filter(item => {
                const coincideBasico = (item.fechaFiltro === fechaSeleccionada) && item.unidad.toLowerCase().includes(textoBusqueda);
                if (!coincideBasico) return false;

                const lugarUpper = item.lugar.toUpperCase();
                if (filtroUbicacionActual === "TODOS") {
                    return true;
                } else if (filtroUbicacionActual === "CARRETERA CHIPULUC") {
                    return lugarUpper.includes("CARRETERA CHIPULUC");
                } else if (filtroUbicacionActual === "OLMOS") {
                    return lugarUpper.includes("OLMOS");
                } else if (filtroUbicacionActual === "OTROS") {
                    return !lugarUpper.includes("CARRETERA CHIPULUC") && !lugarUpper.includes("OLMOS");
                }
                return true;
            });

            renderizarBotones(filtrados);
        }

        function renderizarBotones(datos) {
            const grid = document.getElementById('grid-maquinas');
            let html = '';

            if (datos.length === 0) {
                grid.innerHTML = '<div class="col-span-2 text-center text-slate-400 py-16 text-sm bg-white dark:bg-[#131A29] rounded-3xl border border-slate-200/70 dark:border-slate-800 anim-card">No se encontraron máquinas en esta vista.</div>';
                return;
            }

            datos.forEach((item, idx) => {
                const indexReal = todosLosRegistros.indexOf(item);
                
                if (!mapaColoresLugar[item.lugar]) {
                    mapaColoresLugar[item.lugar] = paletaLugares[contadorLugares % paletaLugares.length];
                    contadorLugares++;
                }
                const estilo = mapaColoresLugar[item.lugar];
                const delay = Math.min(idx * 25, 300);

                html += `
                    <button onclick="abrirDetalle(${indexReal})" style="animation-delay: ${delay}ms;" class="anim-card ${estilo.card} p-3.5 rounded-3xl shadow-[0_2px_10px_-4px_rgba(0,0,0,0.06)] border flex flex-col justify-between items-start text-left transition-all duration-200 hover:shadow-md active:scale-95 min-h-[104px] relative overflow-hidden group">
                        
                        <!-- Barra lateral de acento por ubicación -->
                        <div class="absolute left-0 top-3.5 bottom-3.5 w-1 rounded-r-full ${estilo.accent} opacity-85"></div>

                        <div class="flex justify-between items-start w-full mb-2.5 pl-1.5 gap-2">
                            <div class="w-7 h-7 rounded-xl bg-slate-100 dark:bg-slate-800/90 flex items-center justify-center shrink-0 transition-transform duration-300 group-hover:scale-110">
                                <svg class="w-4 h-4 text-slate-700 dark:text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            </div>
                            <!-- Etiqueta de ubicación tipo píldora -->
                            <span class="text-[9px] font-extrabold ${estilo.badge} border px-2.5 py-0.5 rounded-full text-center leading-tight max-w-[74%] line-clamp-2">${item.lugar}</span>
                        </div>

                        <div class="pl-1.5 w-full">
                            <span class="font-extrabold text-xs leading-snug block text-slate-900 dark:text-white tracking-tight">${item.unidad}</span>
                        </div>
                    </button>
                `;
            });

            grid.innerHTML = html;
        }

        function abrirDetalle(indexOriginal) {
            const m = todosLosRegistros[indexOriginal];
            maquinaActualModal = m.unidad;
            fechaActualModal = m.fechaFiltro;
            
            cargarDatosEnModal(m);
            actualizarBotonesNavegacionFecha();
            
            const modal = document.getElementById('modal-detalle');
            const contenido = document.getElementById('modal-contenido');
            
            modal.classList.remove('hidden');
            contenido.classList.remove('anim-modal');
            void contenido.offsetWidth; 
            contenido.classList.add('anim-modal');
        }

        function cargarDatosEnModal(m) {
            const cuerpo = document.getElementById('modal-datos-cuerpo');
            cuerpo.style.opacity = '0.4';
            
            setTimeout(() => {
                document.getElementById('modal-titulo').innerText = m.unidad;
                document.getElementById('modal-fecha-actual').innerText = m.fechaFiltro;
                document.getElementById('modal-lugar').innerText = m.lugar;
                document.getElementById('modal-operador').innerText = m.operador || 'Sin registro';
                document.getElementById('modal-hinicial').innerText = m.hInicial;
                document.getElementById('modal-hfinal').innerText = m.hFinal;
                document.getElementById('modal-totales').innerText = m.totalHoras + " hrs";
                document.getElementById('modal-combustible').innerText = m.combustible || '0 Gal';
                cuerpo.style.opacity = '1';
            }, 90);
        }

        function actualizarBotonesNavegacionFecha() {
            const idxFechaActual = fechasUnicas.indexOf(fechaActualModal);
            const btnAnt = document.getElementById('btn-fecha-ant');
            const btnSig = document.getElementById('btn-fecha-sig');

            let indiceAnterior = -1;
            for (let i = idxFechaActual - 1; i >= 0; i--) {
                if (verificarSiMaquinaExisteEnFecha(maquinaActualModal, fechasUnicas[i])) {
                    indiceAnterior = i;
                    break;
                }
            }

            let indiceSiguiente = -1;
            for (let i = idxFechaActual + 1; i < fechasUnicas.length; i++) {
                if (verificarSiMaquinaExisteEnFecha(maquinaActualModal, fechasUnicas[i])) {
                    indiceSiguiente = i;
                    break;
                }
            }

            if (indiceAnterior !== -1) {
                btnAnt.disabled = false;
                btnAnt.onclick = () => saltarAFecha(fechasUnicas[indiceAnterior]);
            } else {
                btnAnt.disabled = true;
                btnAnt.onclick = null;
            }

            if (indiceSiguiente !== -1) {
                btnSig.disabled = false;
                btnSig.onclick = () => saltarAFecha(fechasUnicas[indiceSiguiente]);
            } else {
                btnSig.disabled = true;
                btnSig.onclick = null;
            }
        }

        function verificarSiMaquinaExisteEnFecha(nombreMaquina, fechaFiltro) {
            return todosLosRegistros.some(r => r.unidad === nombreMaquina && r.fechaFiltro === fechaFiltro);
        }

        function saltarAFecha(nuevaFecha) {
            const registroEncontrado = todosLosRegistros.find(r => r.unidad === maquinaActualModal && r.fechaFiltro === nuevaFecha);
            if (registroEncontrado) {
                fechaActualModal = nuevaFecha;
                cargarDatosEnModal(registroEncontrado);
                actualizarBotonesNavegacionFecha();
            }
        }

        function cerrarModal() {
            document.getElementById('modal-detalle').classList.add('hidden');
        }

        document.getElementById('modal-detalle').addEventListener('click', function(e) {
            if (e.target === this) {
                cerrarModal();
            }
        });

        document.getElementById('selector-fecha').addEventListener('change', actualizarVista);
        document.getElementById('buscador').addEventListener('input', actualizarVista);
    </script>
</body>
</html>
