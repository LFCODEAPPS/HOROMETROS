<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control De Maquinaria Grupo Bautista</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        /* Ocultar scrollbar para los botones de categoría */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 font-sans">

    <!-- Encabezado -->
    <header class="bg-slate-950 border-b border-slate-800 sticky top-0 z-30 shadow-lg p-4">
        <div class="max-w-xl mx-auto flex justify-between items-center gap-2">
            <div>
                <h1 class="text-base font-extrabold text-emerald-400">Control De Maquinaria Grupo Bautista</h1>
                <p class="text-[10px] text-slate-400 mt-0.5">Despliega para cambiar de fecha 👉</p>
            </div>
            
            <!-- Selector de Fecha Seguro (Desplegable) -->
            <div class="relative shrink-0">
                <select id="selector-fecha" class="bg-emerald-500 text-slate-950 font-black text-xs px-3 py-2 rounded-lg shadow-sm border-none focus:ring-2 focus:ring-emerald-300 cursor-pointer outline-none text-center appearance-none pr-6">
                    <option value="">Cargando...</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-900">
                    <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-4">

        <!-- Botones de Filtro por Ubicación (Scroll Horizontal) -->
        <div class="flex overflow-x-auto gap-2 pb-1 hide-scrollbar" id="botones-categoria">
            <button onclick="filtrarPorUbicacion('TODOS', this)" class="btn-filtro bg-emerald-500 text-slate-900 font-bold px-4 py-2 rounded-full text-xs shrink-0 transition shadow-sm border border-emerald-500">TODOS</button>
            <button onclick="filtrarPorUbicacion('CARRETERA CHIPULUC', this)" class="btn-filtro bg-slate-800 text-slate-300 font-semibold px-4 py-2 rounded-full text-xs shrink-0 transition hover:bg-slate-700 border border-slate-700">CARRETERA CHIPULUC</button>
            <button onclick="filtrarPorUbicacion('OLMOS', this)" class="btn-filtro bg-slate-800 text-slate-300 font-semibold px-4 py-2 rounded-full text-xs shrink-0 transition hover:bg-slate-700 border border-slate-700">OLMOS</button>
            <button onclick="filtrarPorUbicacion('OTROS', this)" class="btn-filtro bg-slate-800 text-slate-300 font-semibold px-4 py-2 rounded-full text-xs shrink-0 transition hover:bg-slate-700 border border-slate-700">OTROS</button>
        </div>

        <!-- Buscador de Equipos -->
        <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">🔍</span>
            <input type="text" id="buscador" placeholder="Buscar equipo o maquinaria..." 
                class="w-full bg-slate-800/50 border border-slate-700/80 text-sm rounded-xl pl-10 pr-4 py-2.5 text-white focus:outline-none focus:border-emerald-500 focus:bg-slate-800 shadow-sm transition">
        </div>

        <!-- Indicador de Carga -->
        <div id="loading" class="text-center py-24 text-slate-400 text-sm font-medium animate-pulse">
            Espere unos segundos mientras carga el sistema...
        </div>

        <!-- Cuadrícula de Botones de Máquinas (Más pequeñas y compactas) -->
        <div id="grid-maquinas" class="grid grid-cols-2 gap-2.5 hidden">
            <!-- Los botones se inyectarán aquí -->
        </div>

    </main>

    <!-- Modal / Tarjeta de Detalle -->
    <div id="modal-detalle" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-4 relative">
            
            <div class="flex justify-between items-start border-b border-slate-700 pb-3">
                <div>
                    <span class="text-[10px] uppercase tracking-wider text-emerald-400 font-bold">Detalle de Unidad</span>
                    <h2 id="modal-titulo" class="text-base font-extrabold text-white mt-0.5 leading-tight">Nombre de Máquina</h2>
                </div>
                <button onclick="cerrarModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm transition shrink-0 ml-2">
                    ✕
                </button>
            </div>

            <!-- Controles de Navegación por Fecha -->
            <div class="flex items-center justify-between bg-slate-900/60 p-2 rounded-xl border border-emerald-900/30">
                <button id="btn-fecha-ant" class="p-2 text-emerald-500 hover:bg-slate-700 rounded-lg transition disabled:opacity-30 disabled:hover:bg-transparent">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <div class="text-center flex-1">
                    <span class="block text-[9px] text-slate-400 uppercase tracking-widest mb-0.5">Fecha del Registro</span>
                    <span id="modal-fecha-actual" class="font-bold text-emerald-400 text-sm">--/--/--</span>
                </div>
                <button id="btn-fecha-sig" class="p-2 text-emerald-500 hover:bg-slate-700 rounded-lg transition disabled:opacity-30 disabled:hover:bg-transparent">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>

            <!-- Datos Ordenados -->
            <div class="space-y-2.5 text-xs md:text-sm">
                
                <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-700/50 flex justify-between items-center">
                    <span class="text-slate-400 text-xs">📍 Lugar:</span>
                    <span id="modal-lugar" class="font-semibold text-white text-right break-words max-w-[70%]">--</span>
                </div>

                <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-700/50 flex justify-between items-center">
                    <span class="text-slate-400 text-xs">👤 Operador:</span>
                    <span id="modal-operador" class="font-semibold text-white text-right truncate pl-2">--</span>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-700/50">
                        <span class="text-slate-400 text-[11px] block mb-1">⏱️ H. Inicial:</span>
                        <span id="modal-hinicial" class="font-bold text-emerald-300 text-sm">--</span>
                    </div>
                    <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-700/50">
                        <span class="text-slate-400 text-[11px] block mb-1">⏱️ H. Final:</span>
                        <span id="modal-hfinal" class="font-bold text-emerald-300 text-sm">--</span>
                    </div>
                </div>

                <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-700/50 flex justify-between items-center">
                    <span class="text-slate-400 text-xs">📊 Horas Totales:</span>
                    <span id="modal-totales" class="font-bold text-blue-400 text-sm">--</span>
                </div>

                <div class="bg-amber-950/30 border border-amber-800/40 p-2.5 rounded-xl flex justify-between items-center">
                    <span class="text-amber-300/80 text-xs font-medium">⛽ Combustible:</span>
                    <span id="modal-combustible" class="font-black text-amber-400 text-sm">--</span>
                </div>
            </div>

            <button onclick="cerrarModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-xl transition text-sm shadow-md mt-2">
                Aceptar / Cerrar
            </button>
        </div>
    </div>

    <script>
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vReJl2BT_9uiaFmB-U1-UlhHKE9lSmhK8jB2bF1Pu1MlM0B15O2H5WxM_ot85WtTIol4_bVhuudvcHU/pub?gid=1193959640&single=true&output=csv";

        let todosLosRegistros = [];
        let fechasUnicas = []; 
        let fechaVigenteParseo = "Sin Fecha";
        
        let maquinaActualModal = "";
        let fechaActualModal = "";
        
        // Filtro actual seleccionado
        let filtroUbicacionActual = "TODOS";

        Papa.parse(SHEET_CSV_URL, {
            download: true,
            header: false,
            complete: function(results) {
                const rows = results.data;
                if (!rows || rows.length === 0) return;

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('grid-maquinas').classList.remove('hidden');
                
                let fechasEncontradasSet = new Set();

                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length === 0) continue;

                    // Detectar Fecha
                    for (let j = 0; j < Math.min(row.length, 6); j++) {
                        let celda = row[j] ? row[j].trim() : "";
                        if (/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/.test(celda)) {
                            fechaVigenteParseo = celda;
                            fechasEncontradasSet.add(celda);
                            break;
                        }
                    }

                    if (row.length < 8) continue;

                    const lugar = row[0] ? row[0].trim() : 'Sin ubicación'; // Columna A
                    const unidad = row[7] ? row[7].trim() : '';             // Columna H

                    if (!unidad || unidad.toUpperCase() === 'UNIDAD' || unidad.toUpperCase() === 'EQUIPO' || unidad.toUpperCase().includes('REPORTE')) {
                        continue;
                    }

                    todosLosRegistros.push({
                        fechaFiltro: fechaVigenteParseo,
                        lugar: lugar,                                     
                        unidad: unidad,                                   
                        operador: row[6] ? row[6].trim() : 'No asignado', 
                        hInicial: row[8] ? row[8].trim() : '-',           
                        hFinal: row[9] ? row[9].trim() : '-',             
                        totalHoras: row[10] ? row[10].trim() : '0',       
                        combustible: row[12] ? row[12].trim() : '0 Gal'   
                    });
                }

                fechasUnicas = Array.from(fechasEncontradasSet);
                const selector = document.getElementById('selector-fecha');
                selector.innerHTML = '';

                if (fechasUnicas.length > 0) {
                    fechasUnicas.forEach(f => {
                        const opt = document.createElement('option');
                        opt.value = f;
                        opt.innerText = f;
                        selector.appendChild(opt);
                    });
                    selector.value = fechasUnicas[fechasUnicas.length - 1]; 
                } else {
                    selector.innerHTML = '<option value="">No hay fechas</option>';
                }

                actualizarVista();
            },
            error: function(err) {
                document.getElementById('loading').innerHTML = '<span class="text-red-400">Error al leer los datos.</span>';
            }
        });

        // Función para cambiar los estilos de los botones de filtro
        function filtrarPorUbicacion(categoria, botonClickado) {
            filtroUbicacionActual = categoria;
            
            // Reiniciar estilos de todos los botones
            const botones = document.querySelectorAll('.btn-filtro');
            botones.forEach(btn => {
                btn.classList.remove('bg-emerald-500', 'text-slate-900', 'border-emerald-500', 'font-bold');
                btn.classList.add('bg-slate-800', 'text-slate-300', 'border-slate-700', 'font-semibold', 'hover:bg-slate-700');
            });

            // Activar el botón clickado
            botonClickado.classList.remove('bg-slate-800', 'text-slate-300', 'border-slate-700', 'font-semibold', 'hover:bg-slate-700');
            botonClickado.classList.add('bg-emerald-500', 'text-slate-900', 'border-emerald-500', 'font-bold');

            actualizarVista();
        }

        function actualizarVista() {
            const fechaSeleccionada = document.getElementById('selector-fecha').value;
            const textoBusqueda = document.getElementById('buscador').value.toLowerCase();

            const filtrados = todosLosRegistros.filter(item => {
                // 1. Filtrar por fecha y búsqueda de texto
                const coincideBasico = (item.fechaFiltro === fechaSeleccionada) && item.unidad.toLowerCase().includes(textoBusqueda);
                if (!coincideBasico) return false;

                // 2. Filtrar por la categoría de ubicación seleccionada
                const lugarUpper = item.lugar.toUpperCase();
                
                if (filtroUbicacionActual === "TODOS") {
                    return true;
                } else if (filtroUbicacionActual === "CARRETERA CHIPULUC") {
                    return lugarUpper.includes("CARRETERA CHIPULUC");
                } else if (filtroUbicacionActual === "OLMOS") {
                    return lugarUpper.includes("OLMOS");
                } else if (filtroUbicacionActual === "OTROS") {
                    // Si no es ni Chipuluc ni Olmos, va a Otros
                    return !lugarUpper.includes("CARRETERA CHIPULUC") && !lugarUpper.includes("OLMOS");
                }
                return true;
            });

            renderizarBotones(filtrados);
        }

        function renderizarBotones(datos) {
            const grid = document.getElementById('grid-maquinas');
            let html = '';

            if (datos.length === 0) {
                grid.innerHTML = '<div class="col-span-2 text-center text-slate-400 py-16 text-sm bg-slate-800/30 rounded-xl border border-slate-800">No se encontraron máquinas.</div>';
                return;
            }

            datos.forEach(item => {
                const indexReal = todosLosRegistros.indexOf(item);
                
                // Color elegante por defecto para todas las tarjetas (ya no son un arcoíris)
                // Se usa un verde oscuro muy profesional que hace resaltar las letras
                html += `
                    <button onclick="abrirDetalle(${indexReal})" class="bg-slate-800 text-slate-200 p-3 rounded-2xl shadow-sm border border-slate-700/80 flex flex-col justify-between items-start text-left transition transform hover:bg-slate-700 active:scale-95 min-h-[90px] relative overflow-hidden group">
                        
                        <!-- Acento de color sutil a la izquierda -->
                        <div class="absolute left-0 top-0 bottom-0 w-1 bg-emerald-500 opacity-80"></div>
                        
                        <div class="flex justify-between items-start w-full mb-1.5 pl-1.5 gap-1">
                            <span class="text-lg shrink-0 opacity-90 group-hover:scale-110 transition-transform">🚜</span>
                            <!-- Etiqueta de ubicación más sutil -->
                            <span class="text-[8px] font-bold bg-slate-900/60 border border-slate-700 text-emerald-400/90 px-1.5 py-0.5 rounded text-right leading-tight truncate max-w-[75%]">${item.lugar}</span>
                        </div>
                        <span class="font-bold text-[11px] md:text-xs leading-snug pl-1.5 pr-1 text-slate-100">${item.unidad}</span>
                    </button>
                `;
            });

            grid.innerHTML = html;
        }

        function abrirDetalle(indexOriginal) {
            const m = todosLosRegistros[indexOriginal];
            maquinaActualModal = m.unidad;
            fechaActualModal = m.fechaFiltro;
            
            cargarDatosEnModal(m);
            actualizarBotonesNavegacionFecha();
            document.getElementById('modal-detalle').classList.remove('hidden');
        }

        function cargarDatosEnModal(m) {
            document.getElementById('modal-titulo').innerText = m.unidad;
            document.getElementById('modal-fecha-actual').innerText = m.fechaFiltro;
            document.getElementById('modal-lugar').innerText = m.lugar;
            document.getElementById('modal-operador').innerText = m.operador || 'Sin registro';
            document.getElementById('modal-hinicial').innerText = m.hInicial;
            document.getElementById('modal-hfinal').innerText = m.hFinal;
            document.getElementById('modal-totales').innerText = m.totalHoras + " hrs";
            document.getElementById('modal-combustible').innerText = m.combustible || '0 Gal';
        }

        function actualizarBotonesNavegacionFecha() {
            const idxFechaActual = fechasUnicas.indexOf(fechaActualModal);
            const btnAnt = document.getElementById('btn-fecha-ant');
            const btnSig = document.getElementById('btn-fecha-sig');

            let indiceAnterior = -1;
            for (let i = idxFechaActual - 1; i >= 0; i--) {
                if (verificarSiMaquinaExisteEnFecha(maquinaActualModal, fechasUnicas[i])) {
                    indiceAnterior = i;
                    break;
                }
            }

            let indiceSiguiente = -1;
            for (let i = idxFechaActual + 1; i < fechasUnicas.length; i++) {
                if (verificarSiMaquinaExisteEnFecha(maquinaActualModal, fechasUnicas[i])) {
                    indiceSiguiente = i;
                    break;
                }
            }

            if (indiceAnterior !== -1) {
                btnAnt.disabled = false;
                btnAnt.onclick = () => saltarAFecha(fechasUnicas[indiceAnterior]);
            } else {
                btnAnt.disabled = true;
                btnAnt.onclick = null;
            }

            if (indiceSiguiente !== -1) {
                btnSig.disabled = false;
                btnSig.onclick = () => saltarAFecha(fechasUnicas[indiceSiguiente]);
            } else {
                btnSig.disabled = true;
                btnSig.onclick = null;
            }
        }

        function verificarSiMaquinaExisteEnFecha(nombreMaquina, fechaFiltro) {
            return todosLosRegistros.some(r => r.unidad === nombreMaquina && r.fechaFiltro === fechaFiltro);
        }

        function saltarAFecha(nuevaFecha) {
            const registroEncontrado = todosLosRegistros.find(r => r.unidad === maquinaActualModal && r.fechaFiltro === nuevaFecha);
            if (registroEncontrado) {
                fechaActualModal = nuevaFecha;
                cargarDatosEnModal(registroEncontrado);
                actualizarBotonesNavegacionFecha();
            }
        }

        function cerrarModal() {
            document.getElementById('modal-detalle').classList.add('hidden');
        }

        document.getElementById('selector-fecha').addEventListener('change', actualizarVista);
        document.getElementById('buscador').addEventListener('input', actualizarVista);
    </script>
</body>
</html>
