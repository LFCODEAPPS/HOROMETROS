<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Maquinaria por Unidad</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

    <!-- Encabezado -->
    <header class="bg-slate-950 border-b border-slate-800 sticky top-0 z-30 shadow-md p-4">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-base font-bold text-emerald-400">Selección de Maquinaria</h1>
                <p class="text-xs text-slate-400" id="fecha-subtitulo">Sincronizado con Google Sheets</p>
            </div>
            <div id="badge-fecha" class="bg-emerald-500 text-slate-950 font-black text-xs px-3 py-1 rounded shadow">
                --/--/--
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-4">

        <!-- Buscador de Equipos -->
        <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">🔍</span>
            <input type="text" id="buscador" placeholder="Buscar equipo o maquinaria..." 
                class="w-full bg-slate-800 border border-slate-700 text-sm rounded-xl pl-10 pr-4 py-3 text-white focus:outline-none focus:border-emerald-500 shadow-sm">
        </div>

        <!-- Indicador de Carga -->
        <div id="loading" class="text-center py-20 text-slate-400 text-sm">
            Cargando unidades desde Google Sheets...
        </div>

        <!-- Cuadrícula de Botones de Máquinas -->
        <div id="grid-maquinas" class="grid grid-cols-2 gap-3 hidden">
            <!-- Los botones se inyectarán aquí -->
        </div>

    </main>

    <!-- Modal / Tarjeta de Detalle -->
    <div id="modal-detalle" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md p-5 shadow-2xl space-y-4 relative animate-in fade-in zoom-in duration-200">
            
            <div class="flex justify-between items-start border-b border-slate-700 pb-3">
                <div>
                    <span class="text-xs uppercase tracking-wider text-emerald-400 font-bold">Detalle de Unidad</span>
                    <h2 id="modal-titulo" class="text-lg font-extrabold text-white mt-0.5">Nombre de Máquina</h2>
                </div>
                <button onclick="cerrarModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm transition">
                    ✕
                </button>
            </div>

            <!-- Datos Ordenados -->
            <div class="space-y-3 text-sm">
                <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-700/50 flex justify-between items-center">
                    <span class="text-slate-400 text-xs">👤 Operador (Col. G):</span>
                    <span id="modal-operador" class="font-semibold text-white text-right">--</span>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-700/50">
                        <span class="text-slate-400 text-xs block mb-1">⏱️ H. Inicial (Col. I):</span>
                        <span id="modal-hinicial" class="font-bold text-emerald-300 text-base">--</span>
                    </div>
                    <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-700/50">
                        <span class="text-slate-400 text-xs block mb-1">⏱️ H. Final (Col. J):</span>
                        <span id="modal-hfinal" class="font-bold text-emerald-300 text-base">--</span>
                    </div>
                </div>

                <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-700/50 flex justify-between items-center">
                    <span class="text-slate-400 text-xs">📊 Horas Totales (Col. K):</span>
                    <span id="modal-totales" class="font-bold text-blue-400 text-base">--</span>
                </div>

                <div class="bg-amber-950/40 border border-amber-800/50 p-3 rounded-xl flex justify-between items-center">
                    <span class="text-amber-300 text-xs font-medium">⛽ Combustible Abastecido (Col. M):</span>
                    <span id="modal-combustible" class="font-black text-amber-400 text-base">--</span>
                </div>
            </div>

            <button onclick="cerrarModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-xl transition text-sm">
                Aceptar / Cerrar
            </button>
        </div>
    </div>

    <script>
        // Enlace CSV de tu Google Sheet
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vReJl2BT_9uiaFmB-U1-UlhHKE9lSmhK8jB2bF1Pu1MlM0B15O2H5WxM_ot85WtTIol4_bVhuudvcHU/pub?gid=1193959640&single=true&output=csv";

        let maquinasData = [];

        Papa.parse(SHEET_CSV_URL, {
            download: true,
            header: false,
            complete: function(results) {
                const rows = results.data;
                if (!rows || rows.length === 0) return;

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('grid-maquinas').classList.remove('hidden');

                // Detección automática de la fecha
                let ultimaFecha = "11/11/26";
                for (let r = 0; r < Math.min(rows.length, 5); r++) {
                    for (let c = 0; c < Math.min(rows[r].length, 5); c++) {
                        let cell = rows[r][c] ? rows[r][c].trim() : "";
                        if (/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(cell)) {
                            ultimaFecha = cell;
                        }
                    }
                }
                document.getElementById('badge-fecha').innerText = ultimaFecha;

                // Mapeo de columnas según tus indicaciones:
                // Columna H (índice 7): Unidad
                // Columna G (índice 6): Operador
                // Columna I (índice 8): Horómetro Inicial
                // Columna J (índice 9): Horómetro Final
                // Columna K (índice 10): Horas Totales
                // Columna M (índice 12): Combustible Abastecido
                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length < 8) continue;

                    const unidad = row[7] ? row[7].trim() : ''; // Columna H
                    if (!unidad || unidad.toUpperCase() === 'UNIDAD' || unidad.includes('REPORTE')) continue;

                    maquinasData.push({
                        unidad: unidad,
                        operador: row[6] ? row[6].trim() : 'No asignado', // Columna G
                        hInicial: row[8] ? row[8].trim() : '-',          // Columna I
                        hFinal: row[9] ? row[9].trim() : '-',            // Columna J
                        totalHoras: row[10] ? row[10].trim() : '0',      // Columna K
                        combustible: row[12] ? row[12].trim() : '0 Gal'  // Columna M
                    });
                }

                renderizarBotones(maquinasData);
            },
            error: function(err) {
                document.getElementById('loading').innerHTML = '<span class="text-red-400">Error al leer los datos de la hoja.</span>';
                console.error(err);
            }
        });

        function renderizarBotones(datos) {
            const grid = document.getElementById('grid-maquinas');
            let html = '';

            if (datos.length === 0) {
                grid.innerHTML = '<div class="col-span-2 text-center text-slate-500 py-8">No se encontraron unidades en la Columna H.</div>';
                return;
            }

            datos.forEach((item, index) => {
                html += `
                    <button onclick="abrirDetalle(${index})" class="bg-emerald-600 hover:bg-emerald-500 text-slate-950 p-4 rounded-2xl shadow-md border border-emerald-500 flex flex-col justify-between items-start text-left transition transform active:scale-95 h-28">
                        <span class="text-2xl">🚜</span>
                        <span class="font-black text-sm md:text-base leading-snug line-clamp-2 text-slate-950">${item.unidad}</span>
                    </button>
                `;
            });

            grid.innerHTML = html;
        }

        function abrirDetalle(index) {
            const m = maquinasData[index];
            document.getElementById('modal-titulo').innerText = m.unidad;
            document.getElementById('modal-operador').innerText = m.operador || 'Sin registro';
            document.getElementById('modal-hinicial').innerText = m.hInicial;
            document.getElementById('modal-hfinal').innerText = m.hFinal;
            document.getElementById('modal-totales').innerText = m.totalHoras + " hrs";
            document.getElementById('modal-combustible').innerText = m.combustible || '0 Gal';

            document.getElementById('modal-detalle').classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('modal-detalle').classList.add('hidden');
        }

        // Filtro de búsqueda en tiempo real
        document.getElementById('buscador').addEventListener('input', function(e) {
            const texto = e.target.value.toLowerCase();
            const filtrados = maquinasData.filter(m => m.unidad.toLowerCase().includes(texto));
            renderizarBotones(filtrados);
        });
    </script>
</body>
</html>
